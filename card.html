<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedMed</title>
<!-- Legacy passerby path. New bands write get.html; keep this redirect so older
     NDEF URLs that point at /card/#d=… still open the tapper view. -->
<script>
(function () {
  var hash = location.hash || '';
  var target = '/get' + hash;
  try {
    // Prefer relative get.html when served as card.html (Pages / local file).
    if (/card\.html?/i.test(location.pathname) || /\/card\/?$/i.test(location.pathname)) {
      target = location.pathname.replace(/card\.html?$/i, 'get.html').replace(/\/card\/?$/i, '/get') + hash;
    }
  } catch (e) {}
  location.replace(target);
})();
</script>
<meta http-equiv="refresh" content="0;url=/get">
</head>
<body>
<p>Opening emergency card… <a id="go" href="/get">Continue</a></p>
<script>
  document.getElementById('go').href = '/get' + (location.hash || '');
</script>
</body>
</html>
