# Cloudflare Pages — static passerby shell (no build step).
# Direct Upload via `.github/workflows/pages-deploy.yml` deploys to Pages
# project `redmed` (redmed.pages.dev) and still needs CF API secrets;
# that workflow passes --project-name=redmed explicitly and does not
# read `name` below.
#
# Separately, Cloudflare's git-connected Workers Builds is bound to a
# Worker named `redmed-emergency` in this account — `name` here must
# match that binding or the git-connected build fails on deploy.
name = "redmed-emergency"
pages_build_output_dir = "."
compatibility_date = "2026-01-01"
