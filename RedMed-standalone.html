  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"fbc2ce90-012b-47af-bbf2-090adf1b008a\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<link href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap\" rel=\"stylesheet\">\n<style>\n* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }\nbody { margin:0; font-family:'Plus Jakarta Sans',sans-serif; }\n* { font-family:inherit; }\na { color:#e11d48; text-decoration:none; }\nbutton,input,select { font-family:inherit; }\n::-webkit-scrollbar { display:none; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"topics-data\" style=\"display:none;\">{\"car-crash\":{\"title\":\"Car Crash\",\"symptoms\":[\"Impact injury \u2014 any speed\",\"Unresponsive or confused occupant\",\"Visible bleeding or deformity\"],\"care\":[\"Call 911 \u2014 give exact location and number of people\",\"Turn on hazards. Stay at the scene\",\"Do NOT move them unless there is fire, rising water, or oncoming traffic\",\"If you must move: slide them as one unit \u2014 never twist the neck\",\"Control bleeding: press hard with cloth, do not lift to check\",\"Keep them warm and still until EMS arrives\"]},\"head-pupils\":{\"title\":\"Head &amp; Pupils\",\"symptoms\":[\"Blow to the head\",\"Unequal, very large ('blown'), or non-reactive pupils\",\"Confusion, vomiting, or worsening over minutes\"],\"care\":[\"Call 911 immediately\",\"Shine a light \u2014 pupils should shrink equally; blown or unequal = serious\",\"Keep head, neck, and spine completely still \u2014 do not bend or twist\",\"Do NOT remove a motorcycle helmet unless the airway is blocked and you are trained\",\"Watch for deterioration: worsening confusion, repeated vomiting, one pupil larger\",\"If unconscious but breathing, recovery position only if no spinal injury suspected\"]},\"find-bleeding\":{\"title\":\"Find Bleeding\",\"symptoms\":[\"Trauma with clothing on \u2014 bleeding may be hidden\",\"Belly pain, rigidity, or bruising after impact\",\"Rapidly dropping consciousness\"],\"care\":[\"Call 911 first\",\"Cut or pull clothing away \u2014 expose the entire body to find all wounds\",\"Press hard on every bleeding source you find\",\"Check the abdomen in all 4 quadrants \u2014 tell 911 exactly where it hurts or is hard\",\"Internal bleeding cannot be stopped in the field \u2014 keep them still and warm\"]},\"bad-bleeding\":{\"title\":\"Bad Bleeding\",\"symptoms\":[\"Blood spurting in pulses (arterial)\",\"Soaks through cloth in under 1 minute\",\"Large pool of blood forming\"],\"care\":[\"Call 911 \u2014 uncontrolled bleeding kills in minutes\",\"Press with both hands as hard as you can \u2014 your full body weight if needed\",\"Do NOT lift to check \u2014 it restarts clotting. Add more cloth on top if it soaks through\",\"For a limb: if pressure fails after 3 minutes, apply tourniquet 2\u20133 inches above the wound\",\"Wound packing: push cloth into a cavity wound and press hard for a full 3 minutes\"]},\"belt-tourniquet\":{\"title\":\"Belt Tourniquet\",\"symptoms\":[\"Life-threatening limb bleeding not controlled by direct pressure\",\"Partial or complete amputation of arm or leg\"],\"care\":[\"Call 911 first \u2014 tourniquet is a last resort for limbs only\",\"Place 2\u20133 inches above the wound, NOT on a joint\",\"Tighten until all bleeding stops completely \u2014 it will hurt; that is correct\",\"Note the exact time applied \u2014 write it on their skin if possible\",\"Do NOT loosen or remove until EMS takes over\",\"Never apply to the neck, chest, or abdomen\"]},\"gunshot-stab\":{\"title\":\"Gunshot / Stab\",\"symptoms\":[\"Any penetrating wound from bullet or blade\",\"Entry wound may be small \u2014 exit wound may be large\"],\"care\":[\"Call 911 \u2014 confirm scene is safe before approaching\",\"Press hard on the wound with both hands \u2014 do not remove the object if still embedded\",\"Chest wound sucking air? Seal it with plastic on 3 sides, leave one side open\",\"Limb wound that won't stop? Apply tourniquet high and tight above the wound\",\"Note time of tourniquet application\",\"Keep them still, warm, and talking until EMS arrives\"]},\"cpr\":{\"title\":\"CPR\",\"symptoms\":[\"Unresponsive \u2014 does not react to voice or sternal rub\",\"No normal breathing (absent or only gasping)\",\"No pulse felt at neck within 10 seconds\"],\"care\":[\"Call 911 now \u2014 put phone on speaker\",\"Hands-only CPR: heel of hand on center of chest, lock elbows, compress 2\u20132.4 inches deep\",\"Rate: 100\u2013120 per minute \u2014 push to the beat of 'Stayin' Alive'\",\"Allow full chest recoil between compressions \u2014 do not lean\",\"Trained? 30 compressions \u2192 2 rescue breaths (1 second each, chest must rise)\",\"AED: turn it on the moment one is available \u2014 follow every prompt\",\"Do not stop until EMS takes over or person clearly recovers\"]},\"choking\":{\"title\":\"Choking\",\"symptoms\":[\"Cannot speak, cry, or cough forcefully\",\"High-pitched noise or no sound when breathing\",\"Clutching throat \u2014 universal choking sign\"],\"care\":[\"Ask 'Are you choking?' \u2014 if they can cough hard, let them\",\"If they cannot: stand behind them, lean them forward\",\"5 firm back blows between shoulder blades with heel of hand\",\"5 abdominal thrusts (Heimlich): fist above navel, sharp inward-and-upward thrust\",\"Alternate 5 back blows + 5 thrusts until object is expelled or they go unconscious\",\"If they become unconscious: lower them to the floor and start CPR \u2014 each time you open the airway, look for the object before giving breaths\"]},\"shock\":{\"title\":\"Shock\",\"symptoms\":[\"Pale, cold, clammy skin\",\"Rapid weak pulse; rapid shallow breathing\",\"Confusion, anxiety, or sudden extreme fatigue\"],\"care\":[\"Call 911 \u2014 shock is life-threatening\",\"Lay them flat on their back; elevate legs 12 inches if no spinal or leg injury\",\"Control any visible bleeding immediately\",\"Keep them warm \u2014 cover with a blanket or clothing\",\"Do NOT give food or water \u2014 aspiration risk\",\"Do NOT let them walk or sit up\",\"Talk to them calmly; keep monitoring breathing until EMS arrives\"]},\"cold-hypothermia\":{\"title\":\"Cold (Hypothermia)\",\"symptoms\":[\"Shivering that has stopped (severe sign)\",\"Slurred speech, confusion, or stumbling\",\"Skin is cold to touch; body temp below 95\u00b0F (35\u00b0C)\"],\"care\":[\"Call 911 \u2014 severe hypothermia needs hospital rewarming\",\"Move them out of the cold gently \u2014 rough handling can trigger cardiac arrest\",\"Remove all wet clothing; replace with dry insulation\",\"Cover head, neck, and torso first \u2014 these lose heat fastest\",\"Warm slowly: body heat, blankets, warm dry air \u2014 no electric blankets or direct heat\",\"If conscious and able to swallow: warm (not hot) drinks \u2014 never alcohol\",\"If unresponsive and not breathing: start CPR\"]},\"heat-stroke\":{\"title\":\"Heat Stroke\",\"symptoms\":[\"Hot skin \u2014 may be dry or sweaty\",\"Confusion, slurred speech, seizure, or unresponsiveness\",\"Core temperature above 104\u00b0F (40\u00b0C)\"],\"care\":[\"Call 911 \u2014 heat stroke kills; cooling is the emergency treatment\",\"Move immediately into shade or air conditioning\",\"Remove excess clothing to expose as much skin as possible\",\"Cool NOW by any means: ice bath (most effective), cold wet cloths on neck/armpits/groin, fan with misting\",\"Do NOT give fluids if confused or unresponsive \u2014 aspiration risk\",\"If fully conscious and able to swallow: cold water only \u2014 no aspirin or acetaminophen\",\"If unresponsive and not breathing: start CPR\"]},\"burn-care\":{\"title\":\"Burn Care\",\"symptoms\":[\"Redness and pain (1st degree)\",\"Blistering with intense pain (2nd degree)\",\"White, leathery, or charred skin with little pain (3rd degree \u2014 nerve damage)\"],\"care\":[\"Call 911 for burns larger than the palm, on the face, hands, feet, or genitals, or any 3rd-degree burn\",\"Cool the burn under cool running water for 10\u201320 minutes \u2014 never use ice\",\"Remove rings, watches, and tight clothing near the burn before swelling starts\",\"Cover loosely with a clean, non-stick dressing or cloth\",\"Do NOT pop blisters or apply butter, oil, or ointment\",\"Watch for shock: pale, cold, rapid breathing\"]},\"electrical-chemical-burns\":{\"title\":\"Electrical &amp; Chemical Burns\",\"symptoms\":[\"Visible entry and exit wound (electrical) \u2014 damage often worse than it looks\",\"Chemical contact with skin, eyes, or clothing\",\"Irregular heartbeat, confusion, or muscle pain after shock\"],\"care\":[\"Do NOT touch them until you're sure the power source is off\",\"Call 911 \u2014 electrical burns cause internal damage far beyond the skin\",\"For chemicals: brush off dry powder first, then flush skin with running water for 20 minutes\",\"Remove any clothing or jewelry contaminated with the chemical\",\"Be ready for CPR \u2014 electrical shock can stop the heart\",\"Cover the burn loosely once flushed or the power is confirmed off\"]}}<\u002Fdiv>\n<style>\n  html,body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:#f0f0f5; }\n  #sim-wrap { display:flex; align-items:center; justify-content:center; width:100vw; height:100vh; }\n  #sim-phone { flex-shrink:0; width:393px; height:852px; transform-origin:center center; border-radius:52px; overflow:hidden; box-shadow:0 0 0 1px rgba(0,0,0,0.12), 0 24px 64px rgba(0,0,0,0.18), 0 8px 24px rgba(0,0,0,0.10); transform:var(--phone-scale,scale(1)); }\n  #sim-wrap > div:not(#sim-phone) { display:none !important; }\n  .tab-btn { flex:1; background:none; border:none; padding:4px 0 6px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0; -webkit-tap-highlight-color:transparent; transition:opacity 0.1s; }\n  .tab-btn:active { opacity:0.7; }\n<\u002Fstyle>\n<script>\nwindow._scalePhone = function() {\n  var vw = window.innerWidth, vh = window.innerHeight;\n  var s = Math.min(1, (vh - 16) / 852, (vw - 16) / 393);\n  document.documentElement.style.setProperty('--phone-scale', 'scale(' + s + ')');\n};\nwindow.addEventListener('resize', window._scalePhone);\n<\u002Fscript>\n<div id=\"sim-wrap\" style=\"position: absolute; left: 0; top: 0\">\n  <!-- Xcode simulator frame -->\n  <div id=\"sim-phone\">\n  <div style=\"position:relative; width:393px; height:852px; border-radius:52px; overflow:hidden;\n    box-shadow:0 0 0 1px rgba(0,0,0,0.12), 0 24px 64px rgba(0,0,0,0.18), 0 8px 24px rgba(0,0,0,0.10);\">\n    <div style=\"position:absolute; inset:0; border-radius:52px; overflow:hidden; background:#fff7f7; display:flex; flex-direction:column;\">\n\n      <!-- STATUS BAR -->\n      <div style=\"flex-shrink:0; height:59px; position:relative; background:transparent;\">\n        <span style=\"position:absolute; top:18px; left:34px; font-size:15px; font-weight:600; color:#1c1917; letter-spacing:-0.4px; z-index:1;\">9:41<\u002Fspan>\n        <div style=\"position:absolute; top:20px; right:20px; display:flex; align-items:center; gap:5px; z-index:1;\">\n          <svg width=\"17\" height=\"11\" viewBox=\"0 0 17 11\"><rect x=\"0\" y=\"3.5\" width=\"2.5\" height=\"7.5\" rx=\"0.7\" fill=\"#1c1917\"><\u002Frect><rect x=\"4\" y=\"2\" width=\"2.5\" height=\"9\" rx=\"0.7\" fill=\"#1c1917\"><\u002Frect><rect x=\"8\" y=\"0.5\" width=\"2.5\" height=\"10.5\" rx=\"0.7\" fill=\"#1c1917\"><\u002Frect><rect x=\"12\" y=\"0\" width=\"2.5\" height=\"11\" rx=\"0.7\" fill=\"#1c1917\"><\u002Frect><\u002Fsvg>\n          <svg width=\"15\" height=\"12\" viewBo >\n            How It Works\n            <svg width=\"5\" height=\"8\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fa>\n          <a href=\"security.html\" style=\"display:flex; align-items:center; justify-content:space-between; padding:9px 14px; font-size:11px; font-weight:400; color:#1c1917; border-top:0.5px solid rgba(28,25,23,0.07); text-decoration:none;\">\n            Security\n            <svg width=\"5\" height=\"8\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fa>\n          <button onClick=\"{{ tapScanBracelet }}\" style=\"width:100%; display:flex; align-items:center; justify-content:space-between; padding:9px 14px; font-size:11px; font-weight:600; color:#e11d48; border:none; border-top:0.5px solid rgba(28,25,23,0.07); background:none; cursor:pointer; font-family:inherit; text-align:left;\">\n            NFC tap card (preview)\n            <svg width=\"5\" height=\"8\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#e11d48\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n          <div style=\"padding:8px 14px 5px; font-size:11px; font-weight:800; color:#44403c; letter-spacing:0.6px; text-transform:uppercase; border-top:0.5px solid rgba(28,25,23,0.07);\">Design<\u002Fdiv>\n          <button onClick=\"{{ previewAppLock }}\" style=\"width:100%; display:flex; align-items:center; justify-content:space-between; padding:9px 14px; font-size:11px; font-weight:400; color:#1c1917; border:none; border-top:0.5px solid rgba(28,25,23,0.07); background:white; cursor:pointer; font-family:inherit; text-align:left;\">\n            AppLock / Face ID gate (preview)\n            <svg width=\"5\" height=\"8\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <!-- dismiss backdrop -->\n        <div onClick=\"{{ tapHelp }}\" style=\"position:absolute; inset:0; z-index:19;\"><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- CONTENT -->\n      <div style=\"flex:1; overflow-y:scroll; -webkit-overflow-scrolling:touch; touch-action:pan-y; position:relative; min-height:0; padding-bottom:64px; overscroll-behavior:contain;\" id=\"main-scroll\">\n\n        <!-- MY ID -->\n        <sc-if value=\"{{ isMyID }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:{{ pageBg }}; min-height:100%; padding-bottom:12px;\">\n            <!-- Header -->\n            <div style=\"padding:10px 20px 8px; position:relative;\">\n              <button onClick=\"{{ tapEdit }}\" style=\"position:absolute; top:14px; right:20px; background:none; border:none; padding:0; cursor:pointer; font-size:17px; font-weight:400; color:#e11d48; font-family:inherit; letter-spacing:-0.2px; line-height:1;\">Edit<\u002Fbutton>\n              <sc-if value=\"{{ noData }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-size:11px; font-weight:500; color:#78716c; line-height:1.5;\">Tap <span style=\"font-weight:700; color:#e11d48;\">Edit<\u002Fspan> to add your name and set up your bracelet.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hasData }}\" hint-placeholder-val=\"{{ false }}\">\n                <button onClick=\"{{ tapBracelet }}\" style=\"display:flex; align-items:center; gap:8px; padding:4px 0; background:none; border:none; cursor:pointer; text-align:left;\">\n                  <img src=\"6fb9e42e-5356-4f15-8d99-9c1d1a71547e\" style=\"width:48px; height:48px; border-radius:13px; box-shadow:0 3px 10px rgba(225,29,72,0.15); flex-shrink:0;\" alt=\"RedM a(255,255,255,0.92); border-radius:18px; border:1px solid rgba(28,25,23,0.08); padding:14px 14px; margin-bottom:8px;\">\n              <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:10px;\">\n                <div style=\"width:28px; height:28px; border-radius:8px; background:rgba(225,29,72,0.1); display:flex; align-items:center; justify-content:center; flex-shrink:0;\">\n                  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"#e11d48\"><path d=\"M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-7 3a1 1 0 011 1v3h3a1 1 0 010 2h-3v3a1 1 0 01-2 0v-3H8a1 1 0 010-2h3V7a1 1 0 011-1z\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <span style=\"font-size:12px; font-weight:700; color:#1c1917; letter-spacing:-0.1px;\">Roadside First Response<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:6px;\">\n                <div style=\"display:flex; gap:8px; align-items:flex-start;\"><span style=\"font-size:10px; font-weight:700; color:#e11d48; flex-shrink:0; margin-top:1px;\">1<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#1c1917; line-height:1.45;\">Turn on hazards. Don't move injured \u2014 unless fire or traffic danger.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; gap:8px; align-items:flex-start;\"><span style=\"font-size:10px; font-weight:700; color:#e11d48; flex-shrink:0; margin-top:1px;\">2<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#1c1917; line-height:1.45;\">Check breathing. Tilt head, lift chin. If no pulse \u2014 start CPR.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; gap:8px; align-items:flex-start;\"><span style=\"font-size:10px; font-weight:700; color:#e11d48; flex-shrink:0; margin-top:1px;\">3<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#1c1917; line-height:1.45;\">Press hard on bleeding. Don't lift to check. Add cloth on top.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; gap:8px; align-items:flex-start;\"><span style=\"font-size:10px; font-weight:700; color:#e11d48; flex-shrink:0; margin-top:1px;\">4<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#1c1917; line-height:1.45;\">Keep them warm and still. Talk to them. Note time of injury.<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- SECOND ROADSIDE BOX -->\n            <div style=\"background:rgba(255,255,255,0.92); border-radius:18px; border:1px solid rgba(28,25,23,0.08); padding:14px 14px; margin-bottom:8px;\">\n              <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:10px;\">\n                <div style=\"width:28px; height:28px; border-radius:8px; background:rgba(225,29,72,0.1); display:flex; align-items:center; justify-content:center; flex-shrink:0;\">\n                  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"#e11d48\"><path d=\"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <span style=\"font-size:12px; font-weight:700; color:#1c1917; letter-spacing:-0.1px;\">What to Tell 911<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:6px;\">\n                <div style=\"display:flex; gap:8px; align-items:flex-start;\"><span style=\"font-size:10px; font-weight:700; color:#e11d48; flex-shrink:0; margin-top:1px;\">\u2192<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#1c1917; line-height:1.45;\">Your exact location \u2014 read the GPS coordinates above.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; gap:8px; align-items:flex-start;\"><span style=\"font-size:10px; font-weight:700; color:#e11d48; flex-shrink:0; margin-top:1px;\">\u2192<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#1c1917; line-height:1.45;\">Number of people injured and visible injuries.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; gap:8px; align-items:flex-start;\"><span style=\"font-size:10px; font-weight:700; color:#e11d48; flex-shrink:0; margin-top:1px;\">\u2192<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#1c1917; line-height:1.45;\">If anyone is unconscious or not breathing.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; gap:8px; align-items:flex-start;\"><span style=\"font-size:10px; font-weight:700; color:#e11d48; flex-shrink:0; margin-top:1px;\">\u2192<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#1c1917; line-height:1.45;\">Stay on the line \u2014 let the dispatcher guide you.<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- COMMON TRAUMA BOX -->\n            <div style=\"background:rgba(255,255,255,0.92); border-radius:18px; border:1px solid rgba(28,25,23,0.08); padding:14px 14px; margin-bottom:8px;\">\n              <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:10px;\">\n                <div style=\"width:28px; height:28px; border-radius:8px; background:#e11d48; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">\n                  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"white\"><path d=\"M12 2a5 5 0 11-5 5 5 5 0 015-5m0 12c5.33 0 8 2.67 8 4v2H4v-2c0-1.33 2.67-4 8-4z\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <span style=\"font-size:12px; font-weight:700; color:#1c1917; letter-spacing:-0.1px;\">Common Trauma Situations<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;\">\n                <div style=\"background:#fff7f7; border-radius:10px; padding:8px 8px;\">\n                  <div style=\"font-size:10px; font-weight:700; color:#e11d48; margin-bottom:2px;\">Bleeding<\u002Fdiv>\n                  <div style=\"font-size:9px; color:#1c1917; line-height:1.4;\">Press hard. Belt tourniquet on limb 2\u20133 in above. Note time.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:#fff7f7; border-radius:10px; padding:8px 8px;\">\n                  <div style=\"font-size:10px; font-weight:700; color:#e11d48; margin-bottom:2px;\">Not Breathing<\u002Fdiv>\n                  <div style=\"font-size:9px; color:#1c1917; line-height:1.4;\">Tilt head, lift chin. No pulse? 100\u2013120/min hard compressions.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:#fff7f7; border-radius:10px; padding:8px 8px;\">\n                  <div style=\"font-size:10px; font-weight:700; color:#e11d48; margin-bottom:2px;\">Spinal<\u002Fdiv>\n                  <div style=\"font-size:9px; color:#1c1917; line-height:1.4;\">Don't move. Keep head still. Move only if fire or traffic.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:#fff7f7; border-radius:10px; padding:8px 8px;\">\n                  <div style=\"font-size:10px; font-weight:700; color:#e11d48; margin-bottom:2px;\">Burns<\u002Fdiv>\n                  <div style=\"font-size:9px; color:#1c1917; line-height:1.4;\">Running water 10+ min. No ice. Cover loosely.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:#fff7f7; border-radius:10px; padding:8px 8px;\">\n                  <div style=\"font-size:10px; font-weight:700; color:#e11d48; margin-bottom:2px;\">Shock<\u002Fdiv>\n                  <div style=\"font-size:9px; color:#1c1917; line-height:1.4;\">Lay flat, elevate legs. Keep warm. No food or water.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"background:#fff7f7; border-radius:10px; padding:8px 8px;\">\n                  <div style=\"font-size:10px; font-weight:700; color:#e11d48; margin-bottom:2px;\">Hypothermia<\u002Fdiv>\n                  <div style=\"font-size:9px; color:#1c1917; line-height:1.4;\">Remove wet clothes. Warm slowly. No rubbing.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- NEARBY TRAUMA HOSPITALS -->\n            <div style=\"background:rgba(255,255,255,0.92); border-radius:18px; border:1px solid rgba(28,25,23,0.08); padding:14px; margin-bottom:8px;\">\n              <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:10px;\">\n                <div style=\"width:28px; height:28px; border-radius:8px; background:#e11d48; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">\n                  <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"white\"><path d=\"M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-1 12h-4v4h-4v-4H6v-4h4V7h4v4h4v4z\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <span style=\"font-size:12px; font-weight:700; color:#1c1917; letter-spacing:-0.1px; flex:1;\">Nearby Trauma Hospitals<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hospitalsIdle }}\" hint-placeholder-val=\"{{ true }}\">\n                <button onClick=\"{{ findHospitals }}\" style=\"width:100%; background:#e11d48; color:white; border:none; border-radius:999px; padding:11px; font-size:12px; font-weight:700; cursor:pointer;\">Find hospitals near me<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hospitalsLoading }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:11px; color:#78716c; text-align:center; padding:6px 0;\">Finding your location\u2026<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hospitalsError }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:11px; color:#78716c; text-align:center; padding:4px 0 8px;\">{{ hospitalsErrorMsg }}<\u002Fdiv>\n                <button onClick=\"{{ findHospitals }}\" style=\"width:100%; background:rgba(255,255,255,0.82); color:#1c1917; border:1px solid rgba(28,25,23,0.08); border-radius:999px; padding:10px; font-size:11px; font-weight:600; cursor:pointer;\">Try again<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hospitalsFound }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex; flex-direction:column; gap:6px;\">\n                  <sc-for list=\"{{ hospitalRows }}\" as=\"h\" hint-placeholder-count=\"3\">\n                    <a href=\"{{ h.mapsUrl }}\" target=\"_blank\" style=\"display:flex; align-items:center; justify-content:space-between; gap:8px; background:#fff7f7; border-radius:10px; padding:9px 10px; text-decoration:none;\">\n                      <div style=\"min-width:0;\">\n                        <div style=\"font-size:11px; font-weight:700; color:#1c1917; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ h.name }}<\u002Fdiv>\n                        <div style=\"font-size:9.5px; color:#78716c; margin-top:1px;\">{{ h.distance }} mi away<\u002Fdiv>\n                      <\u002Fdiv>\n                      <span style=\"font-size:9.5px; font-weight:700; color:#e11d48; flex-shrink:0;\">Directions \u203a<\u002Fspan>\n                    <\u002Fa>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <div style=\"background:rgba(255,255,255,0.92); border-radius:18px; border:1px solid rgba(28,25,23,0.08); padding:14px; margin-bottom:8px;\">\n              <button onClick=\"{{ toggleSatellite }}\" style=\"width:100%; background:none; border:none; padding:0; cursor:pointer; display:flex; align-items:center; gap:8px; text-align:left;\">\n                <svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"#e11d48\" style=\"flex-shrink:0;\"><path d=\"M10 18a8 8 0 100-16 8 8 0 000 16zm0-14c.5 0 1 .1 1.5.2l-7 7.3A6 6 0 0110 4zm0 12a6.03 6.03 0 01-4.8-2.4l7.1-7.4A6 6 0 0116 10a6 6 0 01-6 6z\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size:11px; font-weight:700; color:#e11d48; flex:1;\">No cell signal?<\u002Fspan>\n                <svg style=\"{{ satelliteChevronStyle }}\" width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"#78716c\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 4l4 4 4-4\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n              <sc-if value=\"{{ showSatellite }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:10px; display:flex; flex-direction:column; gap:7px;\">\n                  <div style=\"font-size:11px; color:#78716c; line-height:1.55;\">iPhone 14+ (iOS 16.1+): hold Side + Volume until Emergency SOS appears, or Settings \u2192 Emergency SOS.<\u002Fdiv>\n                  <button onClick=\"{{ call911 }}\" style=\"width:100%; background:rgba(255,255,255,0.82); color:#1c1917; border:1px solid rgba(28,25,23,0.08); border-radius:999px; padding:10px; font-size:11px; font-weight:600; cursor:pointer; margin-top:2px;\">Open Phone \u00b7 dial 911<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"font-size:10px; color:#78716c; font-weight:500; text-align:center; margin-top:2px; padding-bottom:8px;\">Coordinates show on this screen only. RedMed has no servers.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- AID -->\n        <sc-if value=\"{{ isAid }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:{{ pageBg }}; min-height:100%; padding:10px 16px 20px;\">\n            <div style=\"margin-bottom:14px;\">\n              <div style=\"font-size:22px; font-weight:700; color:#1c1917; letter-spacing:-0.4px; line-height:1.1; margin-bottom:2px;\">Roadside Aid<\u002Fdiv>\n              <div style=\"font-size:12px; font-weight:500; color:#78716c; margin-bottom:12px;\">Call 911 first. Tap a pane \u2014 expand only what you need.<\u002Fdiv>\n              <button onClick=\"{{ call911 }}\" style=\"width:100%; background:linear-gradient(135deg,#ff4d67,#dc0d3e); color:white; border:none; border-radius:999px; padding:14px; font-size:15px; font-weight:700; letter-spacing:-0.2px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 6px 16px rgba(225,29,72,0.28), inset 0 1px 0 rgba(255,255,255,0.22); transition:transform 0.12s; margin-bottom:10px;\" style-active=\"transform:scale(0.97);\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"white\"><path d=\"M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z\"><\u002Fpath><\u002Fsvg>Call 911<\u002Fbutton>\n              <div style=\"display:flex; gap:8px;\">\n                <div style=\"background:rgba(225,29,72,0.1); border-radius:999px; padding:5px 10px;\"><span style=\"font-size:10px; font-weight:700; color:#e11d48; letter-spacing:0.8px; text-transform:uppercase;\">tap to expand<\u002Fspan><\u002Fdiv>\n                <div style=\"background:rgba(255,255,255,0.7); border-radius:999px; padding:5px 10px; border:1px solid rgba(28,25,23,0.07);\"><span style=\"font-size:10px; font-weight:700; color:#78716c; letter-spacing:0.8px; text-transform:uppercase;\">911 first<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; align-items:start;\">\n\n              <div style=\"{{ crashWrap }}\"><div style=\"{{ crashCard }}\">\n                <button onClick=\"{{ toggleCrash }}\" style=\"width:100%; background:none; border:none; padding:14px; cursor:pointer; text-align:left; display:flex; align-items:flex-start; gap:10px; min-height:120px;\">\n                  <div style=\"width:38px; height:38px; border-radius:11px; background:rgba(225,29,72,0.1); display:flex; align-items:center; justify-content:center; flex-shrink:0;\">\n                    <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"#e11d48\"><path d=\"M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                  <div style=\"flex:1; min-width:0;\">\n                    <div style=\"font-size:11px; font-weight:700; color:#1c1917; line-height:1.25; min-height:27px; display:flex; align-items:center;\">\ud83d\ude97 Crash &amp; Head<\u002Fdiv>\n                    <sc-if value=\"{{ crashClosed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:10px; font-weight:600; color:#78716c; margin-top:3px; line-height:1.3;\">Impact \u00b7 neck \u00b7 pupils<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ crashClosed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:9px; font-weight:500; color:#a8a29e; margin-top:2px; line-height:1.3; font-style:italic;\">Watch for confusion or slurred speech.<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <svg style=\"{{ crashChevron }}\" width=\"10\" height=\"16\" viewBox=\"0 0 10 16\" fill=\"none\"><path d=\"M1.5 1L8 8l-6.5 7\" stroke=\"#e11d48\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n                <sc-if value=\"{{ crashOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:0 10px 14px; display:flex; flex-direction:column; gap:7px;\">\n                    <button onClick=\"{{ openCarCrash }}\" style=\"width:100%; background:rgba(255,255,255,0.8); border-radius:12px; border:1px solid rgba(28,25,23,0.08); padding:10px 12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; text-align:left;\"><span style=\"font-size:11px; font-weight:600; color:#1c1917;\">Car Crash<\u002Fspan><svg width=\"6\" height=\"10\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                    <button onClick=\"{{ openHeadPupils }}\" style=\"width:100%; background:rgba(255,255,255,0.8); border-radius:12px; border:1px solid rgba(28,25,23,0.08); padding:10px 12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; text-align:left;\"><span style=\"font-size:11px; font-weight:600; color:#1c1917;\">Head &amp; Pupils<\u002Fspan><svg width=\"6\" height=\"10\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv><\u002Fdiv>\n\n              <div style=\"{{ bleedWrap }}\"><div style=\"{{ bleedCard }}\">\n                <button onClick=\"{{ toggleBleed }}\" style=\"width:100%; background:none; border:none; padding:14px; cursor:pointer; text-align:left; display:flex; align-items:flex-start; gap:10px; min-height:120px;\">\n                  <div style=\"width:38px; height:38px; border-radius:11px; background:#e11d48; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">\n                    <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"white\"><path d=\"M12 2C9.33 2 7 4.33 7 7c0 3.08 2.5 6.66 4 8.83.39.55.9.88 1.5.88.59 0 1.1-.31 1.49-.88C15.5 13.67 17 10.08 17 7c0-2.67-2.33-5-5-5zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                  <div style=\"flex:1; min-width:0;\">\n                    <div style=\"font-size:11px; font-weight:700; color:#1c1917; line-height:1.25; min-height:27px; display:flex; align-items:center;\">\ud83e\ude78 Bleeding<\u002Fdiv>\n                    <sc-if value=\"{{ bleedClosed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:10px; font-weight:600; color:#78716c; margin-top:3px; line-height:1.3;\">Pressure \u00b7 tourniquet<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ bleedClosed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:9px; font-weight:500; color:#a8a29e; margin-top:2px; line-height:1.3; font-style:italic;\">Direct pressure stops most bleeding.<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <svg style=\"{{ bleedChevron }}\" width=\"10\" height=\"16\" viewBox=\"0 0 10 16\" fill=\"none\"><path d=\"M1.5 1L8 8l-6.5 7\" stroke=\"#e11d48\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n                <sc-if value=\"{{ bleedOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:0 10px 14px; display:flex; flex-direction:column; gap:7px;\">\n                    <button onClick=\"{{ openFindBleeding }}\" style=\"width:100%; background:rgba(255,255,255,0.8); border-radius:12px; border:1px solid rgba(28,25,23,0.08); padding:10px 12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; text-align:left;\"><span style=\"font-size:11px; font-weight:600; color:#1c1917;\">Find Bleeding<\u002Fspan><svg width=\"6\" height=\"10\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                    <button onClick=\"{{ openBadBleeding }}\" style=\"width:100%; background:rgba(255,255,255,0.8); border-radius:12px; border:1px solid rgba(28,25,23,0.08); padding:10px 12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; text-align:left;\"><span style=\"font-size:11px; font-weight:600; color:#1c1917;\">Bad Bleeding<\u002Fspan><svg width=\"6\" height=\"10\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                    <button onClick=\"{{ openBeltTourniquet }}\" style=\"width:100%; background:rgba(255,255,255,0.8); border-radius:12px; border:1px solid rgba(28,25,23,0.08); padding:10px 12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; text-align:left;\"><span style=\"font-size:11px; font-weight:600; color:#1c1917;\">Belt Tourniquet<\u002Fspan><svg width=\"6\" height=\"10\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                    <button onClick=\"{{ openGunshot }}\" style=\"width:100%; background:rgba(255,255,255,0.8); border-radius:12px; border:1px solid rgba(28,25,23,0.08); padding:10px 12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; text-align:left;\"><span style=\"font-size:11px; font-weight:600; color:#1c1917;\">Gunshot / Stab<\u002Fspan><svg width=\"6\" height=\"10\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv><\u002Fdiv>\n\n              <div style=\"{{ heartWrap }}\"><div style=\"{{ heartCard }}\">\n                <button onClick=\"{{ toggleHeart }}\" style=\"width:100%; background:none; border:none; padding:14px; cursor:pointer; text-align:left; display:flex; align-items:flex-start; gap:10px; min-height:120px;\">\n                  <div style=\"width:38px; height:38px; border-radius:11px; background:#e11d48; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">\n                    <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"white\"><path d=\"M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                  <div style=\"flex:1; min-width:0;\">\n                    <div style=\"font-size:11px; font-weight:700; color:#1c1917; line-height:1.25; min-height:27px; display:flex; align-items:center;\">\u2764\ufe0f Heart &amp; Airway<\u002Fdiv>\n                    <sc-if value=\"{{ heartClosed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:10px; font-weight:600; color:#78716c; margin-top:3px; line-height:1.3;\">CPR \u00b7 choking<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ heartClosed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:9px; font-weight:500; color:#a8a29e; margin-top:2px; line-height:1.3; font-style:italic;\">Push hard, push fast \u2014 center of chest.<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <svg style=\"{{ heartChevron }}\" width=\"10\" height=\"16\" viewBox=\"0 0 10 16\" fill=\"none\"><path d=\"M1.5 1L8 8l-6.5 7\" stroke=\"#e11d48\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n                <sc-if value=\"{{ heartOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:0 10px 14px; display:flex; flex-direction:column; gap:7px;\">\n                    <button onClick=\"{{ openCPR }}\" style=\"width:100%; background:rgba(255,255,255,0.8); border-radius:12px; border:1px solid rgba(28,25,23,0.08); padding:10px 12px; display:flex; justify-content:s {{ shockClosed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:10px; font-weight:600; color:#78716c; margin-top:3px; line-height:1.3;\">Pale \u00b7 cold \u00b7 clammy<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ shockClosed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:9px; font-weight:500; color:#a8a29e; margin-top:2px; line-height:1.3; font-style:italic;\">A common killer after trauma.<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <svg style=\"{{ shockChevron }}\" width=\"10\" height=\"16\" viewBox=\"0 0 10 16\" fill=\"none\"><path d=\"M1.5 1L8 8l-6.5 7\" stroke=\"#e11d48\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n                <sc-if value=\"{{ shockOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:0 10px 14px;\">\n                    <button onClick=\"{{ openShock }}\" style=\"width:100%; background:rgba(255,255,255,0.8); border-radius:12px; border:1px solid rgba(28,25,23,0.08); padding:10px 12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; text-align:left;\"><span style=\"font-size:11px; font-weight:600; color:#1c1917;\">Shock<\u002Fspan><svg width=\"6\" height=\"10\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv><\u002Fdiv>\n\n              <div style=\"{{ tempWrap }}\"><div style=\"{{ tempCard }}\">\n                <button onClick=\"{{ toggleTemp }}\" style=\"width:100%; background:none; border:none; padding:14px; cursor:pointer; text-align:left; display:flex; align-items:flex-start; gap:10px; min-height:120px;\">\n                  <div style=\"width:38px; height:38px; border-radius:11px; background:rgba(225,29,72,0.1); display:flex; align-items:center; justify-content:center; flex-shrink:0;\">\n                    <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"#e11d48\"><path d=\"M15 13V5a3 3 0 00-6 0v8a5 5 0 106 0zm-3 5a2 2 0 110-4 2 2 0 010 4z\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                  <div style=\"flex:1; min-width:0;\">\n                    <div style=\"font-size:11px; font-weight:700; color:#1c1917; line-height:1.25; min-height:27px; display:flex; align-items:center;\">\ud83c\udf21\ufe0f Cold &amp; Heat<\u002Fdiv>\n                    <sc-if value=\"{{ tempClosed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:10px; font-weight:600; color:#78716c; margin-top:3px; line-height:1.3;\">Notice \u00b7 warm \u00b7 cool down<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ tempClosed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:9px; font-weight:500; color:#a8a29e; margin-top:2px; line-height:1.3; font-style:italic;\">Shivering that stops can mean it's worsening.<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <svg style=\"{{ tempChevron }}\" width=\"10\" height=\"16\" viewBox=\"0 0 10 16\" fill=\"none\"><path d=\"M1.5 1L8 8l-6.5 7\" stroke=\"#e11d48\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n                <sc-if value=\"{{ tempOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:0 10px 14px; display:flex; flex-direction:column; gap:7px;\">\n                    <button onClick=\"{{ openCold }}\" style=\"width:100%; background:rgba(255,255,255,0.8); border-radius:12px; border:1px solid rgba(28,25,23,0.08); padding:10px 12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; text-align:left;\"><span style=\"font-size:11px; font-weight:600; color:#1c1917;\">Cold (Hypothermia)<\u002Fspan><svg width=\"6\" height=\"10\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                    <button onClick=\"{{ openHeat }}\" style=\"width:100%; background:rgba(255,255,255,0.8); border-radius:12px; border:1px solid rgba(28,25,23,0.08); padding:10px 12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; text-align:left;\"><span style=\"font-size:11px; font-weight:600; color:#1c1917;\">Heat (Exhaustion &amp; Stroke)<\u002Fspan><svg width=\"6\" height=\"10\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv><\u002Fdiv>\n\n              <div style=\"{{ burnsWrap }}\"><div style=\"{{ burnsCard }}\">\n                <button onClick=\"{{ toggleBurns }}\" style=\"width:100%; background:none; border:none; padding:14px; cursor:pointer; text-align:left; display:flex; align-items:flex-start; gap:10px; min-height:120px;\">\n                  <div style=\"width:38px; height:38px; border-radius:11px; background:rgba(225,29,72,0.1); display:flex; align-items:center; justify-content:center; flex-shrink:0;\">\n                    <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"#e11d48\"><path d=\"M12 2c1 3-2 4-2 7a3 3 0 006 0c1.5 1 2 3 2 4.5A6.5 6.5 0 018 20a6.5 6.5 0 01-2-12.68C7 9 8 9.5 8.5 9c1-1-1-3 0-5 .8-1.6 2.5-1 3.5-2z\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                  <div style=\"flex:1; min-width:0;\">\n                    <div style=\"font-size:11px; font-weight:700; color:#1c1917; line-height:1.25; min-height:27px; display:flex; align-items:center;\">\ud83d\udd25 Burns<\u002Fdiv>\n                    <sc-if value=\"{{ burnsClosed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:10px; font-weight:600; color:#78716c; margin-top:3px; line-height:1.3;\">Cool it \u00b7 cover it<\u002Fdiv><\u002Fsc-if><sc-if value=\"{{ burnsClosed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:9px; font-weight:500; color:#a8a29e; margin-top:2px; line-height:1.3; font-style:italic;\">Never peel off stuck clothing.<\u002Fdiv><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <svg style=\"{{ burnsChevron }}\" width=\"10\" height=\"16\" viewBox=\"0 0 10 16\" fill=\"none\"><path d=\"M1.5 1L8 8l-6.5 7\" stroke=\"#e11d48\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n                <sc-if value=\"{{ burnsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:0 10px 14px; display:flex; flex-direction:column; gap:7px;\">\n                    <button onClick=\"{{ openBurnCare }}\" style=\"width:100%; background:rgba(255,255,255,0.8); border-radius:12px; border:1px solid rgba(28,25,23,0.08); padding:10px 12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; text-align:left;\"><span style=\"font-size:11px; font-weight:600; color:#1c1917;\">Burn Care<\u002Fspan><svg width=\"6\" height=\"10\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                    <button onClick=\"{{ openElectricalChemical }}\" style=\"width:100%; background:rgba(255,255,255,0.8); border-radius:12px; border:1px solid rgba(28,25,23,0.08); padding:10px 12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; text-align:left;\"><span style=\"font-size:11px; font-weight:600; color:#1c1917;\">Electrical &amp; Chemical<\u002Fspan><svg width=\"6\" height=\"10\" viewBox=\"0 0 6 10\" fill=\"none\"><path d=\"M1 1l4 4-4 4\" stroke=\"#78716c\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv><\u002Fdiv>\n\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- NFC -->\n        <sc-if value=\"{{ isNFC }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:{{ pageBg }}; min-height:100%; padding:12px 16px 20px; overflow-y:auto; -webkit-overflow-scrolling:touch;\">\n            <div style=\"display:flex; flex-direction:column; align-items:center; padding:8px 0 18px;\">\n              <div style=\"font-size:22px; font-weight:700; color:#1c1917; letter-spacing:-0.4px; line-height:1.1; margin-bottom:2px;\">NFC Bracelet<\u002Fdiv>\n              <div style=\"font-size:11px; font-weight:500; color:#78716c; text-align:center; line-height:1.5; max-width:275px;\">iPhone only for setup. Fill My ID, write the band once \u2014 CoreNFC, Face ID, done.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.7); border-radius:14px; border:1px solid rgba(28,25,23,0.08); padding:10px 14px; margin-bottom:16px;\">\n              <div style=\"display:flex; align-items:center; gap:8px; font-size:11px; font-weight:600; color:#78716c; padding:5px 0; border-bottom:0.5px solid rgba(28,25,23,0.08);\">{{ nfcStatusLine1 }}<\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:8px; font-size:11px; font-weight:600; color:#78716c; padding:5px 0;\">{{ nfcStatusLine2 }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font-size:11px; font-weight:600; color:#6b6e7a; text-transform:uppercase; letter-spacing:0.5px; padding:0 4px 6px;\">Set up<\u002Fdiv>\n            <div style=\"background:rgba(255,255,255,0.92); border-radius:18px; border:1px solid rgba(28,25,23,0.08); padding:14px; margin-bottom:16px;\">\n              <button onClick=\"{{ tapWriteNFC }}\" style=
