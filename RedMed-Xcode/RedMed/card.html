<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedMed</title>
<!-- Legacy passerby path. New bands write get.html; keep this redirect so older
     NDEF URLs that point at /card/#d=… still open the tapper view. -->
<script>
(function () {
  var hash = location.hash || '';
  location.replace('get.html' + hash);
})();
</script>
<meta http-equiv="refresh" content="0;url=get.html">
</head>
<body>
<p>Opening emergency card… <a id="go" href="get.html">Continue</a></p>
<script>
  document.getElementById('go').href = 'get.html' + (location.hash || '');
</script>
</body>
</html>
