<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7f7">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<title>RedMed</title>
<style>html,body{background:#fff7f7!important;margin:0}</style>
<!-- Legacy path. Canonical scanner shell is /tapper/ — preserve #d=. -->
<script>
(function () {
  location.replace("/tapper/" + (location.search || "") + (location.hash || ""));
})();
</script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    background: #fff7f7;
    color: #1c1917;
  }
  a { color: #e11d48; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 2px solid #e11d48; outline-offset: 3px; }
</style>
</head>
<body>
  <p><a id="fallback" href="/tapper/">Open emergency card</a></p>
  <script>
    document.getElementById("fallback").href =
      "/tapper/" + (location.search || "") + (location.hash || "");
  </script>
  <noscript><p>JavaScript is off. <a id="ns" href="/tapper/">Open emergency card</a> (hash may drop — enable JS to keep #d=).</p></noscript>
</body>
</html>
