<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RedMed Emergency Card</title>
<style>
  :root {
    --accent: #e11d48;
    --dark: #1c1917;
    --muted: #78716c;
    --bg: #f2f2f7;
    --surface: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--dark);
    line-height: 1.45;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px 16px 48px; }
  .banner {
    display: flex; align-items: center; gap: 8px;
    background: rgba(225, 29, 72, 0.1);
    color: var(--accent);
    font-size: 12px; font-weight: 600;
    padding: 10px 14px; border-radius: 14px; margin-bottom: 14px;
  }
  .btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    color: #fff; font-weight: 700; font-size: 15px;
    padding: 14px 16px; border-radius: 999px; margin-bottom: 10px;
    background: linear-gradient(#ff7289, var(--accent));
    box-shadow: 0 4px 14px rgba(225, 29, 72, 0.28);
  }
  .btn.secondary {
    background: var(--surface); color: var(--dark);
    border: 1px solid rgba(28, 25, 23, 0.08);
    box-shadow: none; font-weight: 600; font-size: 14px;
  }
  .meta {
    text-align: center; font-size: 11px; font-weight: 600;
    color: var(--muted); margin: 8px 0 14px;
  }
  .identity { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px;
  }
  .identity h1 { margin: 0; font-size: 20px; }
  .identity p { margin: 2px 0 0; font-size: 12px; font-weight: 500; color: var(--muted); }
  .label {
    font-size: 12px; font-weight: 600; color: var(--muted);
    letter-spacing: 0.06em; text-transform: uppercase;
    margin: 14px 0 6px 4px;
  }
  .card {
    background: var(--surface); border-radius: 12px; overflow: hidden;
  }
  .row {
    padding: 11px 16px; font-size: 14px;
    border-bottom: 1px solid rgba(28, 25, 23, 0.06);
  }
  .row:last-child { border-bottom: 0; }
  .row a { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 12px; }
  .row .name { font-weight: 600; display: block; }
  .muted { color: rgba(120, 113, 108, 0.55); }
  .aid {
    background: var(--surface); border-radius: 12px;
    padding: 12px; margin-bottom: 10px;
  }
  .aid h3 { margin: 0 0 6px; font-size: 14px; }
  .aid li { font-size: 12px; font-weight: 500; color: var(--muted); margin: 0 0 4px; }
  .aid ul { margin: 0; padding-left: 18px; }
  .foot {
    margin-top: 18px; text-align: center;
    font-size: 10px; font-weight: 500; color: var(--muted);
  }
  .empty {
    background: #fff; border-radius: 14px; padding: 24px; text-align: center;
  }
  .empty h2 { margin: 0 0 8px; font-size: 18px; }
  .empty p { margin: 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="empty"><h2>Loading card…</h2></div>
  </div>
<script>
(function () {
  // Do not log location.hash / payload (see security.html).
  var ROADSIDE = [
    {
      title: "Severe Bleeding",
      care: [
        "Call 911",
        "Press hard with both hands — full body weight if needed",
        "Do NOT lift to check — add more cloth on top",
        "Limb: tourniquet 2–3 inches above wound, note the time",
        "Keep pressure until EMS takes over"
      ]
    },
    {
      title: "CPR",
      care: [
        "Call 911",
        "Heel of hand center of chest, other hand on top",
        "Push hard and fast: 2 inches, 100–120/min",
        "Allow full chest recoil",
        "Use AED as soon as available",
        "Continue until EMS arrives"
      ]
    },
    {
      title: "Choking",
      care: [
        "If they can cough hard, let them",
        "5 firm back blows between shoulder blades",
        "5 abdominal thrusts (Heimlich)",
        "Alternate until object is out or they go unconscious",
        "If unconscious: start CPR"
      ]
    },
    {
      title: "Shock",
      care: [
        "Call 911",
        "Lay flat; elevate legs 12 inches if no spinal/leg injury",
        "Control visible bleeding",
        "Keep warm",
        "Do NOT give food or water",
        "Do NOT let them walk"
      ]
    },
    {
      title: "Car Crash",
      care: [
        "Call 911 — give exact location and number of people",
        "Hazards on. Stay at the scene",
        "Do NOT move them unless fire, water, or traffic",
        "If you must move: slide as one unit — never twist the neck",
        "Control bleeding: press hard with cloth",
        "Keep warm and still until EMS"
      ]
    }
  ];

  function b64urlDecode(s) {
    s = (s || "").replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    try {
      var bin = atob(s);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder("utf-8").decode(bytes);
    } catch (e) {
      return null;
    }
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function phoneDigits(detail) {
    return String(detail || "").replace(/\D/g, "");
  }

  function listCard(title, items) {
    var body;
    if (!items || !items.length) {
      body = '<div class="row muted">—</div>';
    } else {
      body = items.map(function (it) {
        return '<div class="row">' + esc(it) + "</div>";
      }).join("");
    }
    return '<div class="label">' + esc(title) + '</div><div class="card">' + body + "</div>";
  }

  function contactsCard(contacts) {
    var body;
    if (!contacts || !contacts.length) {
      body = '<div class="row muted">—</div>';
    } else {
      body = contacts.map(function (c) {
        var digits = phoneDigits(c.d);
        var call = digits
          ? ' <a href="tel:' + esc(digits) + '">Tap to call</a>'
          : "";
        return (
          '<div class="row"><span class="name">' +
          esc(c.n) +
          "</span>" +
          esc(c.d || "") +
          call +
          "</div>"
        );
      }).join("");
    }
    return '<div class="label">Emergency contacts</div><div class="card">' + body + "</div>";
  }

  function roadsideHTML() {
    var blocks = ROADSIDE.map(function (t) {
      var lis = t.care
        .map(function (s) {
          return "<li>" + esc(s) + "</li>";
        })
        .join("");
      return (
        '<div class="aid"><h3>' +
        esc(t.title) +
        "</h3><ul>" +
        lis +
        "</ul></div>"
      );
    }).join("");
    return (
      '<div class="label">Roadside first aid</div>' +
      '<p class="meta" style="text-align:left;margin:0 0 10px 4px">Quick steps while help is on the way. Call 911 first for any life-threatening emergency.</p>' +
      blocks
    );
  }

  function renderEmpty(msg) {
    document.getElementById("app").innerHTML =
      '<div class="empty"><h2>RedMed</h2><p>' +
      esc(msg) +
      "</p></div>" +
      roadsideHTML() +
      '<p class="foot">Roadside first aid is always available. Medical details appear when a paired bracelet opens this page.</p>';
  }

  function render(p) {
    var name = p.n || "Unknown";
    var sub = [p.b, p.bt ? "Blood type " + p.bt : ""].filter(Boolean).join(" · ");
    var donor = p.o === true ? "Yes" : p.o === false ? "No" : "—";
    var firstContact = (p.e && p.e[0] && phoneDigits(p.e[0].d)) || "";

    var html = "";
    html +=
      '<div class="banner">Emergency medical card — read only</div>';
    html += '<a class="btn" href="tel:911">Call 911</a>';
    if (firstContact) {
      html +=
        '<a class="btn secondary" href="sms:' +
        esc(firstContact) +
        '">Text emergency contact</a>';
    }
    html +=
      '<p class="meta">Profile last updated ' +
      esc(p.u || "—") +
      "</p>";
    html +=
      '<div class="identity"><div class="mark">R</div><div><h1>' +
      esc(name) +
      "</h1><p>" +
      esc(sub || "—") +
      "</p></div></div>";
    html += listCard("Allergies", p.a);
    html += listCard("Conditions", p.c);
    html += listCard("Medications", p.m);
    html +=
      '<div class="label">Organ donor status</div><div class="card"><div class="row">Registered donor <span style="float:right;font-weight:700">' +
      esc(donor) +
      "</span></div></div>";
    html += contactsCard(p.e);
    html += roadsideHTML();
    html +=
      '<p class="foot">Generated by RedMed. No account or login needed. Medical details come from the bracelet; first-aid steps are the same for every band.</p>';
    document.getElementById("app").innerHTML = html;
  }

  var hash = location.hash || "";
  var m = hash.match(/[#&]d=([^&]*)/);
  if (!m) {
    renderEmpty("No medical profile in this link. Pair a blank RedMed bracelet in the iOS app to write your My ID.");
    return;
  }
  var json = b64urlDecode(decodeURIComponent(m[1]));
  if (!json) {
    renderEmpty("This bracelet payload could not be decoded.");
    return;
  }
  try {
    var payload = JSON.parse(json);
    // Only render known string/array fields — never inject raw HTML from the tag.
    render({
      n: typeof payload.n === "string" ? payload.n : "",
      b: typeof payload.b === "string" ? payload.b : "",
      bt: typeof payload.bt === "string" ? payload.bt : "",
      a: Array.isArray(payload.a) ? payload.a.filter(function (x) { return typeof x === "string"; }) : [],
      m: Array.isArray(payload.m) ? payload.m.filter(function (x) { return typeof x === "string"; }) : [],
      c: Array.isArray(payload.c) ? payload.c.filter(function (x) { return typeof x === "string"; }) : [],
      e: Array.isArray(payload.e)
        ? payload.e
            .filter(function (x) { return x && typeof x.n === "string"; })
            .map(function (x) {
              return { n: x.n, d: typeof x.d === "string" ? x.d : "" };
            })
        : [],
      o: typeof payload.o === "boolean" ? payload.o : null,
      u: typeof payload.u === "string" ? payload.u : ""
    });
  } catch (e) {
    renderEmpty("This bracelet payload is not valid JSON.");
  }
})();
</script>
</body>
</html>
