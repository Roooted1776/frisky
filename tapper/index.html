<title>RedMed — tap to scan</title>
<style>html,body{background:#fff7f7!important;margin:0}</style>
<script>
function redmedAssetURL(file) {
  try {
    var path = location.pathname || '';
    var i = path.indexOf('/tapper/');
    if (i >= 0) return path.slice(0, i + '/tapper/'.length) + file;
    if (/\/tapper$/i.test(path)) return path + '/' + file;
  } catch (e) {}
  return file;
}
</script>
<link rel="preload" as="image" href="pheart.png" fetchpriority="high" id="redmedLogoPreload">
<script>
(function () {
  var link = document.getElementById('redmedLogoPreload');
  if (link) link.href = redmedAssetURL('pheart.png');
})();
</script>
<script>
(function () {
  try {
    if (!window.crypto || !window.crypto.subtle) return;
    if ((location.hash || '').indexOf('d=') < 0) return;
    var label = 'RedMed-NFC-AES-GCM-v1';
    window.__redmedAesKeyPromise = crypto.subtle
      .digest('SHA-256', new TextEncoder().encode(label))
      .then(function (hash) {
        return crypto.subtle.importKey('raw', hash, { name: 'AES-GCM' }, false, ['decrypt']);
      });
  } catch (e) {}
})();
</script>
<script>
(function () {
  function appPreview() {
    try {
      if (window.__REDMED_APP_PREVIEW) return true;
      return new URLSearchParams(location.search || '').get('src') === 'app';
    } catch (e) { return !!window.__REDMED_APP_PREVIEW; }
  }
  if (appPreview()) return;
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker
    .register('sw.js', { scope: './', updateViaCache: 'none' })
    .then(function (reg) {
      var run = function () { try { reg.update(); } catch (e) {} };
      if (typeof requestIdleCallback === 'function') requestIdleCallback(run, { timeout: 4000 });
      else setTimeout(run, 2500);
    })
    .catch(function () {});
})();
</script>
<meta name="description" content="Tap the RedMed band to open the emergency card. Quick. No login. No server. No app — HTML only on this phone.">
