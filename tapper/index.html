<title>RedMed</title>
<style>html,body{background:#fff7f7!important;margin:0}</style>
<!-- Legacy / root URL. Canonical scanner shell is /tapper/ — preserve #d=.
     Fix #3: use URL construction to safely compose the destination. -->
<script>
(function () {
  var dest = new URL('/tapper/', location.origin);
  dest.search = location.search;
  location.replace(dest.pathname + dest.search + location.hash);
})();
</script>
<style>
html,body{background:#fff7f7!important;margin:0}
/* First paint = active panel only. Without this, the big stylesheet arrives late
   and every .panel is visible on cream until .panel{display:none} parses. */
.panel{display:none} .panel.active{display:block}
html.tab-911 .panel,html.tab-aid .panel{display:none}
html.tab-911 #panel-911,html.tab-aid #panel-aid{display:block}
/* Bare /tapper/ (no #d=): hide the dash YOU chart on first paint. The head
   script adds html.is-unlinked before <body> so this cannot flash dashes. */
html.is-unlinked .you-card,
html.is-unlinked .list-grid{display:none!important}
html.is-unlinked #rmEmpty{display:block!important}
</style>
<script>
// Resolve the start tab before first paint. Bare open / #d= → medical (YOU).
// Deep links: #911 #aid ?tab=911 #d=…&tab=aid. Never treat #d= as a tab id.
// NFC / Edit stay owner-app only.
(function () {
  function norm(id) {
    id = String(id || "").toLowerCase();
    if (id === "911" || id === "aid") return id;
    if (id === "rm" || id === "redmed" || id === "you" || id === "card" || id === "medical") return "medical";
    return "";
  }
  function tabFromLocation() {
    var hash = "";
    var search = "";
    try { hash = location.hash || ""; } catch (e0) {}
    try { search = location.search || ""; } catch (e1) {}
    if (/^#d=/i.test(hash)) {
      var m = /(?:^|&)tab=([^&]*)/i.exec(hash.slice(1));
      if (m) {
        try {
          var t = norm(decodeURIComponent(m[1] || ""));
          if (t) return t;
        } catch (e2) {}
      }
    } else {
      var raw = hash.replace(/^#/, "").split("&")[0].split("=")[0];
      var fromHash = norm(raw);
      if (fromHash) return fromHash;
    }
    try {
      var q = new URLSearchParams(search).get("tab");
      var fromQ = norm(q);
      if (fromQ) return fromQ;
    } catch (e3) {}
    return "medical";
  }
  window.__redmedTabFromLocation = tabFromLocation;
  var tab = tabFromLocation();
  window.__redmedStartTab = tab;
  try {
    document.documentElement.setAttribute("data-start-tab", tab);
    document.documentElement.classList.remove("tab-911", "tab-aid");
    if (tab === "911" || tab === "aid") document.documentElement.classList.add("tab-" + tab);
  } catch (e4) {}
  // First-paint empty state: no #d= and not in-app Preview/embed → No Patient.
  // #d= stays off this class until decode settles (treat-first / renderProfile).
  try {
    var startHash = "";
    var startSearch = "";
    try { startHash = location.hash || ""; } catch (e5) {}
    try { startSearch = location.search || ""; } catch (e6) {}
    var appSrc = false;
    try { appSrc = new URLSearchParams(startSearch).get("src") === "app"; } catch (e7) {}
    var appShell = false;
    try { appShell = !!(window.__REDMED_APP_PREVIEW || window.__REDMED_APP_EMBED || appSrc); } catch (e8) {}
    if (!appShell && !/^#d=/i.test(startHash)) {
      document.documentElement.classList.add("is-unlinked");
    }
  } catch (e9) {}
})();
</script>
<script>
/* Phone · tablet · wide before first paint — viewport short side + width.
   Landscape phones stay phone (min(w,h) < 500). Cloudflare may already set
   data-device-edge; ?view= / session lock wins. Body deviceViews() keeps it live. */
(function () {
  function pickDevice(w, h) {
    w = w || 0;
    h = h || 0;
    var shortSide = Math.min(w, h) || w;
    if (shortSide > 0 && shortSide < 500) return 'phone';
    if (w >= 1024) return 'wide';
    if (w >= 768 || shortSide >= 600) return 'tablet';
    return 'phone';
  }
  window.__redmedPickDevice = pickDevice;
  try {
    var q = '';
    try {
      q = (new URLSearchParams(location.search || '').get('view') || '').toLowerCase();
    } catch (e0) {}
    if (q === 'phone' || q === 'tablet' || q === 'wide') {
      document.documentElement.setAttribute('data-device', q);
      document.documentElement.setAttribute('data-view-lock', q);
      return;
    }
    if (q === 'auto') {
      try { sessionStorage.removeItem('redmed-tapper-view'); } catch (e1) {}
    }
    var stored = '';
    try { stored = sessionStorage.getItem('redmed-tapper-view') || ''; } catch (e2) {}
    if (stored === 'phone' || stored === 'tablet' || stored === 'wide') {
      document.documentElement.setAttribute('data-device', stored);
      document.documentElement.setAttribute('data-view-lock', stored);
      return;
    }
    var w = window.innerWidth || document.documentElement.clientWidth || 0;
    var h = window.innerHeight || document.documentElement.clientHeight || 0;
    document.documentElement.setAttribute('data-device', pickDevice(w, h));
    document.documentElement.removeAttribute('data-view-lock');
  } catch (e3) {}
})();
</script>
<script>
// Same-origin asset paths for /tapper/, /tapper.html, and bundle roots.
function redmedAssetURL(file) {
  try {
    var path = location.pathname || '';
    var i = path.indexOf('/tapper/');
    if (i >= 0) return path.slice(0, i + '/tapper/'.length) + file;
    if (/\/tapper$/i.test(path)) return path + '/' + file;
  } catch (e) {}
  return file;
}
</script>
<!-- No logo preload. src is set after profile paint so #d= decrypt is not
     racing BrandLogo.svg / PNG densities during HTML parse. -->
<script>
// Prefetch AES key while HTML parses — overlaps with body download on band taps.
(function () {
  try {
    if (!window.crypto || !window.crypto.subtle) return;
    if ((location.hash || '').indexOf('d=') < 0) return;
    var label = 'RedMed-NFC-AES-GCM-v1';
    window.__redmedAesKeyPromise = crypto.subtle
      .digest('SHA-256', new TextEncoder().encode(label))
      .then(function (hash) {
        return crypto.subtle.importKey('raw', hash, { name: 'AES-GCM' }, false, ['decrypt']);
      });
  } catch (e) {}
})();
</script>
<script>
// Register SW ASAP so the next band tap is cache-first. Skip app Preview/Scan.
// Payload stays in #d= only — SW never stores medical fields.
(function () {
  function appPreview() {
    try {
      if (window.__REDMED_APP_PREVIEW) return true;
      return new URLSearchParams(location.search || '').get('src') === 'app';
    } catch (e) { return !!window.__REDMED_APP_PREVIEW; }
  }
  if (appPreview()) return;
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker
    .register('sw.js', { scope: './', updateViaCache: 'none' })
    .then(function (reg) {
      var run = function () { try { reg.update(); } catch (e) {} };
      if (typeof requestIdleCallback === 'function') requestIdleCallback(run, { timeout: 4000 });
      else setTimeout(run, 2500);
    })
    .catch(function () {});
})();
</script>
<meta name="description" content="Tap the RedMed band to open the emergency card. Quick. No login. No server. No app — HTML only on this phone.">
<!-- ONE scanner file: tapper.html (Pages + app bundle).
     Specs (permanent):
     - Tabs: RedMed · 911 · Aid only — no Edit, no NFC
     - Tapper / EMT / helper: passive HF NFC opens this HTML page — no RedMed
       app required to view. Owner Edit / NFC write live only in the native app.
     - Data: #d= only — no server DB. New writes: flat array → AES-GCM
       (public client key) → base64url. Legacy still works: named JSON,
       pre-AES compact arrays, optional 0x01 zlib.
       New array: [blood, allergies, meds, emergencyPhone, name, dob,
       conditions, contacts, donor, updated?, pregnant?, deafOrVisionImpaired?, notes?]
       Legacy array: [name, dob, blood, donor, allergies, meds,
       conditions, contacts, updated?]
     - Offline: sw.js Cache Storage — cache-first multi-key shell for almost-instant
       EMT open after first online load; activate clears prior CACHE buckets
       (bump redmed-tapper-vN). Never wait on network when a shell copy exists.
     - Real bracelet NFC tap (`tapper.html#d=…`) → everything stays on that phone
       (profile, 911, Aid, SOS siren). Local only once tap — everyone and
       everything. No server / no online. Bare /tapper/ without `#d=` and in-app
       Preview/Scan (`?src=app`) do not auto-arm SOS. Stop on Find Help or Aid.
       Explicit SOS tap opens `tel:` immediately (no in-page confirm). Crash
       waits the US Crash Detection delay (10s alert + 30s countdown) then
       the same `tel:` unless Stop. Band-tap auto-arm is siren only.
       Phones with RedMed installed should not hit this Safari SOS path:
       Associated Domains when AASA is live, else `redmed://band#d=` handoff
       before arm (own band quiet; other band in-app card). Do not invent
       BLE / local-network ranging.
       Bare /tapper/ without `#d=` (and a failed / empty `#d=`) paints the
       No Patient empty state — not a blank YOU chart with dashes. #911 /
       #aid / ?tab= still open those panels; #d= stays the profile payload.
     - Layout: any phone + iPad, iOS 15+ (and Android). Fluid width, safe-area
       insets, no horizontal scroll. Device views: phone · tablet · wide (Auto
       or View control). Tap-to-view: no account, no login, and no
       authentication gate before or on this page — EMT / helper open the card
       immediately from `#d=`. Nothing covers or blocks the YOU card (no login,
       no overlay, no privacy veil). Treat fields (name, blood, allergies, meds,
       conditions) start decrypting as soon as the YOU-card DOM exists — before
       911 / Aid HTML finishes parsing. Helper may put the phone down to tend to
       the person — Screen Wake Lock holds the display on for the whole band-tap
       patient session (not only while SOS is armed). SOS / wake run after vitals
       paint. Owner unlock / edit / band write stay in the native app only.
       iOS may need a gesture to unmute AudioContext; motion permission only
       when the helper taps SOS (not an auth gate).
     - Tap physics (matches AppConfig.BraceletRF): intentional ~1–2″,
       walk-by ~6–8″ does not fire, reliable coupling dies past ~4″,
       passive 13.56 MHz HF NFC (not Bluetooth) → Safari opens this page
       (apple-mobile-web-app-capable=no so iOS BTR is not a Home Screen web app)
     - Logo: BrandLogo.svg on YOU-card (crisp at any size / iPad retina) with
       PNG densities BrandLogo.png / @2x / @3x as fallback. Transparent mark —
       page cream shows through; CSS circle-crops. Bundle /tapper/ + assets/.
       Header mark stays next to the name on empty and named cards. Deferred
       until after profile paint so band-tap #d= decrypt wins the wire (in-app
       Preview / owner embed included). Shell is SW cache-first for almost-
       instant reopen; first visit still needs network once.
     - Device views: phone · tablet · wide. Auto picks from viewport aspect
       (short side + width; landscape phones stay phone). Cloudflare Worker
       may set data-device-edge from UA / CF-Device-Type; client refines.
       View control / ?view=phone|tablet|wide locks. Larger logo + type on
       tablet/wide; wide uses a two-column medical layout (YOU card | lists).
     - Legacy card.html / get.html /get/ / redmed-emergency.html redirect to /tapper/ and keep #d=
     Source of truth: tapper/index.html. Xcode copies it into the app bundle as tapper.html
     at build (pbxproj “Bundle passerby tapper”). Repo-root tapper.html is a #d=-preserving
     redirect to /tapper/, not a second shell. Do not leave a stale owner/RedMed/tapper.html.
     Hosted AppConfig URL https://redmed-emergency.maxaguilaraasted.workers.dev/tapper/
     (Cloudflare Worker redmed-emergency). github.io backup + custom domain TBD — docs/domain.md. -->
<style>
  :root {
    --accent: #e11d48; /* Color.redmedAccent */
    --accent-soft: #ff7289; /* Color.redmedAccentLift */
    --bg: #fff7f7; /* Color.redmedBg */
    --wash: #ffe8eb; /* Color.redmedWash */
    --dark: #1c1917; /* Color.redmedDark */
    --muted: #78716c; /* Color.redmedMuted */
    --divider: rgba(28,25,23,0.08);
    --tab-off: #78716c; /* same as --muted / Color.redmedMuted */
    /* Cream-lift — same Color.redmedSurface; not pure white on --bg. */
    --surface: #fff3f4;
    --box: 10px;
    --chip: 7px;
    --logo: 72px;
    --shadow: 0 1px 2px rgba(28,25,23,0.04), 0 6px 16px rgba(225,29,72,0.05);
    --shadow-accent: 0 6px 16px rgba(225,29,72,0.22);
    /* Fluid shell — phone → tablet → wide (iPad / landscape). */
    --page-max: 480px;
    --page-pad-x: clamp(16px, 4.2vw, 28px);
    --tabbar-h: 69.5px; /* matches ContentView content inset */
    --fs-name: 22px; /* hero under logo — RED-9 / Main.dc */
    --fs-row: 14px; /* YOU rows + lists — matches Theme CardRow */
    --fs-title: 16px;
    --fs-body: 14px;
    --fs-btn: 16px;
    --fs-name-max: 22px;
    --fs-row-max: 15px;
    --fs-title-max: 17px;
    --fs-body-max: 16px;
    --fs-btn-max: 18px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
  }
  /* Auto breakpoints — overridden by html[data-device] when View is locked. */
  @media (min-width: 600px) {
    :root { --page-max: 560px; --logo: 80px; --tabbar-h: 69.5px; }
  }
  @media (min-width: 768px) {
    :root {
      --page-max: 720px;
      --logo: 96px;
      --tabbar-h: 69.5px;
      --box: 12px;
      --page-pad-x: clamp(20px, 3.6vw, 32px);
      --fs-name-max: 28px;
      --fs-row-max: 17px;
      --fs-title-max: 19px;
      --fs-body-max: 17px;
      --fs-btn-max: 20px;
    }
  }
  @media (min-width: 1024px) {
    :root {
      --page-max: 960px;
      --logo: 108px;
      --page-pad-x: clamp(24px, 3.2vw, 36px);
      --fs-name-max: 30px;
      --fs-row-max: 18px;
      --fs-title-max: 20px;
      --fs-body-max: 18px;
      --fs-btn-max: 21px;
    }
  }
  @media (min-width: 900px) and (orientation: landscape) {
    :root { --page-max: min(980px, 94vw); --logo: 108px; }
  }
  /* Locked device views (View control / ?view=). */
  html[data-device="phone"] {
    --page-max: 480px;
    --logo: 72px;
    --page-pad-x: clamp(16px, 4.2vw, 28px);
    --box: 10px;
    --fs-name-max: 22px;
    --fs-row-max: 15px;
    --fs-title-max: 17px;
    --fs-body-max: 16px;
    --fs-btn-max: 18px;
  }
  html[data-device="tablet"] {
    --page-max: 720px;
    --logo: 96px;
    --page-pad-x: clamp(20px, 3.6vw, 32px);
    --box: 12px;
    --fs-name-max: 28px;
    --fs-row-max: 17px;
    --fs-title-max: 19px;
    --fs-body-max: 17px;
    --fs-btn-max: 20px;
  }
  html[data-device="wide"] {
    --page-max: 960px;
    --logo: 108px;
    --page-pad-x: clamp(24px, 3.2vw, 36px);
    --box: 12px;
    --fs-name-max: 30px;
    --fs-row-max: 18px;
    --fs-title-max: 20px;
    --fs-body-max: 18px;
    --fs-btn-max: 21px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    /* Locked viewport — `.app` scrolls; tabbar stays in-flow (not position:fixed). */
    height: 100%;
    max-height: 100%;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scrollbar-gutter: stable;
    /* Same cream as Color.redmedBg / LaunchBackground — no system white overscroll. */
    background: var(--bg);
  }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    background: #fff7f7;
    color: #1c1917;
  }
  a { color: #e11d48; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 2px solid #e11d48; outline-offset: 3px; }
</style>
