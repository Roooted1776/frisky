ize:12px; font-weight:500; color:#e11d48; margin-top:2px;\">{{ c.detail }} · Tap to call<\u002Fdiv>\n                      <\u002Fa>\n                    <\u002Fsc-for>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ cardNoContacts }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"padding:11px 16px;\"><span style=\"font-size:11px; color:#78716c; opacity:0.4;\">—<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"font-size:11px; font-weight:500; color:#1c1917; text-align:center; line-height:1.7; padding:28px 20px 0;\">\"Control your fear. Control the moment.<br>You have what it takes to save a life.\"<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- Help (Find Help) -->\n            <sc-if value=\"{{ cardIsHelp }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:6px 16px 28px;\">\n                <div style=\"font-size:22px; font-weight:700; color:#1c1917; letter-spacing:-0.4px; line-height:1.1; margin-bottom:10px;\">Find Help<\u002Fdiv>\n                <button onClick=\"{{ cardCallContact }}\" style=\"width:100%; background:rgba(255,255,255,0.82); color:#1c1917; border:1px solid rgba(28,25,23,0.08); border-radius:999px; padding:13px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; margin-bottom:6px;\">Call first emergency contact<\u002Fbutton>\n                <div style=\"font-size:11px; font-weight:500; color:#78716c; text-align:center; margin-bottom:12px;\">Calls the first saved contact — confirm before dialing.<\u002Fdiv>\n                <div style=\"background:rgba(255,255,255,0.92); border:1px solid rgba(28,25,23,0.07); border-radius:18px; padding:14px; text-align:center; margin-bottom:8px;\">\n                  <div style=\"display:inline-block; font-size:9px; font-weight:700; letter-spacing:1.1px; color:#e11d48; background:rgba(225,29,72,0.1); border-radius:999px; padding:4px 9px; margin-bottom:6px;\">LIVE GPS<\u002Fdiv>\n                  <div style=\"font-family:'JetBrains Mono',ui-monospace,monospace; font-size:17px; font-weight:700; color:#1c1917;\">37.334900, -122.009020<\u002Fdiv>\n                  <div style=\"font-size:11px; font-weight:600; color:#78716c; margin-top:4px;\">Accuracy ±12 m<\u002Fdiv>\n                <\u002Fdiv>\n                <button onClick=\"{{ copyCoordinates }}\" style=\"width:100%; background:#1c1917; color:white; border:none; border-radius:999px; padding:12px; font-size:11px; font-weight:700; cursor:pointer; margin-bottom:8px;\">{{ copyLabel }}<\u002Fbutton>\n                <button onClick=\"{{ cardTextLocation }}\" style=\"width:100%; background:rgba(255,255,255,0.82); color:#1c1917; border:1px solid rgba(28,25,23,0.08); border-radius:999px; padding:12px; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit; margin-bottom:12px;\">Text location to emergency contact<\u002Fbutton>\n                <div style=\"background:rgba(255,255,255,0.92); border:1px solid rgba(28,25,23,0.07); border-radius:18px; padding:14px 16px; margin-bottom:10px;\">\n                  <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:8px;\">\n                    <div style=\"width:28px; height:28px; border-radius:8px; background:rgba(225,29,72,0.1); color:#e11d48; font-size:14px; display:flex; align-items:center; justify-content:center;\">✚<\u002Fdiv>\n                    <div style=\"font-size:15px; font-weight:700; color:#1c1917;\">Roadside First Response<\u002Fdiv>\n                  <\u002Fdiv>\n                  <ol style=\"margin:0; padding-left:18px; font-size:13px; font-weight:500; line-height:1.45; color:#1c1917;\">\n                    <li>Turn on hazards. Don’t move injured — unless fire or traffic danger.<\u002Fli>\n                    <li>Check breathing. Tilt head, lift chin. If no pulse — start CPR.<\u002Fli>\n                    <li>Press hard on bleeding. Don’t lift to check. Add cloth on top.<\u002Fli>\n                    <li>Keep them warm and still. Talk to them. Note time of injury.<\u002Fli>\n                  <\u002Fol>\n                <\u002Fdiv>\n                <div style=\"background:rgba(255,255,255,0.92); border:1px solid rgba(28,25,23,0.07); border-radius:18px; padding:14px 16px; margin-bottom:10px;\">\n                  <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:8px;\">\n                    <div style=\"width:28px; height:28px; border-radius:8px; background:rgba(225,29,72,0.1); color:#e11d48; font-size:14px; display:flex; align-items:center; justify-content:center;\">ℹ<\u002Fdiv>\n                    <div style=\"font-size:15px; font-weight:700; color:#1c1917;\">What to Tell {{ cardEmergencyNum }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <ul style=\"margin:0; padding-left:18px; font-size:13px; font-weight:500; line-height:1.45; color:#1c1917;\">\n                    <li>Your exact location — read the GPS coordinates above.<\u002Fli>\n                    <li>Number of people injured and visible injuries.<\u002Fli>\n                    <li>If anyone is unconscious or not breathing.<\u002Fli>\n                    <li>Stay on the line — let the dispatcher guide you.<\u002Fli>\n                  <\u002Ful>\n                <\u002Fdiv>\n                <div style=\"background:rgba(255,255,255,0.92); border:1px solid rgba(28,25,23,0.07); border-radius:18px; padding:14px 16px; margin-bottom:10px;\">\n                  <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:8px;\">\n                    <div style=\"width:28px; height:28px; border-radius:8px; background:rgba(225,29,72,0.1); color:#e11d48; font-size:14px; display:flex; align-items:center; justify-content:center;\">📡<\u002Fdiv>\n                    <div style=\"font-size:15px; font-weight:700; color:#1c1917;\">No cell signal<\u002Fdiv>\n                  <\u002Fdiv>\n                  <p style=\"margin:0; font-size:13px; font-weight:500; line-height:1.45; color:#1c1917;\">iPhone 14+ (iOS 16.1+): hold Side + Volume until Emergency SOS appears. RedMed cannot start Satellite SOS itself.<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"font-size:10px; font-weight:500; color:#78716c; text-align:center; margin:12px 0 8px;\">Coordinates show on this screen only. RedMed has no servers.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- Aid -->\n            <sc-if value=\"{{ cardIsAid }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:6px 16px 28px;\">\n                <div style=\"font-size:22px; font-weight:700; color:#1c1917; letter-spacing:-0.4px; line-height:1.1; margin-bottom:4px;\">Roadside Aid<\u002Fdiv>\n                <div style=\"font-size:12px; font-weight:500; color:#78716c; margin-bottom:10px;\">Tap a pane — expand only what you need.<\u002Fdiv>\n                <a href=\"{{ cardEmergencyTel }}\" style=\"display:flex; align-items:center; justify-content:center; gap:8px; width:100%; background:linear-gradient(135deg,#ff4d67,#dc0d3e); color:white; border-radius:999px; padding:14px; font-size:15px; font-weight:700; letter-spacing:-0.2px; box-shadow:0 6px 16px rgba(225,29,72,0.32); margin-bottom:14px; text-decoration:none;\">Call {{ cardEmergencyNum }}<\u002Fa>\n                <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px;\">\n                  <details style=\"background:rgba(255,255,255,0.92); border:1px solid rgba(28,25,23,0.07); border-radius:14px; padding:0 12px;\"><summary style=\"cursor:pointer; list-style:none; display:flex; gap:8px; align-items:flex-start; padding:12px 0;\"><span style=\"width:38px; height:38px; border-radius:11px; background:rgba(225,29,72,0.1); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;\">🚗<\u002Fspan><span><span style=\"font-size:13px; font-weight:700; color:#1c1917; display:block;\">Crash &amp; Head<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#78716c;\">Impact · neck · pupils<\u002Fspan><\u002Fspan><\u002Fsummary><ol style=\"margin:0 0 12px; padding-left:18px; font-size:13px; font-weight:500; line-height:1.45;\"><li>Call {{ cardEmergencyNum }} — give exact location and number of people<\u002Fli><li>Hazards on. Do not move them unless fire or traffic danger<\u002Fli><li>Keep head/neck still. Control bleeding with firm pressure<\u002Fli><\u002Fol><\u002Fdetails>\n                  <details style=\"background:rgba(255,255,255,0.92); border:1px solid rgba(28,25,23,0.07); border-radius:14px; padding:0 12px;\"><summary style=\"cursor:pointer; list-style:none; display:flex; gap:8px; align-items:flex-start; padding:12px 0;\"><span style=\"width:38px; height:38px; border-radius:11px; background:rgba(225,29,72,0.1); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;\">🩸<\u002Fspan><span><span style=\"font-size:13px; font-weight:700; color:#1c1917; display:block;\">Bleeding<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#78716c;\">Pressure · tourniquet<\u002Fspan><\u002Fspan><\u002Fsummary><ol style=\"margin:0 0 12px; padding-left:18px; font-size:13px; font-weight:500; line-height:1.45;\"><li>Press hard with both hands — do not lift to check<\u002Fli><li>Add cloth on top if soaked. Limb: tourniquet 2–3 in above<\u002Fli><li>Note the time. Stay on the line with {{ cardEmergencyNum }}<\u002Fli><\u002Fol><\u002Fdetails>\n                  <details style=\"background:rgba(255,255,255,0.92); border:1px solid rgba(28,25,23,0.07); border-radius:14px; padding:0 12px;\"><summary style=\"cursor:pointer; list-style:none; display:flex; gap:8px; align-items:flex-start; padding:12px 0;\"><span style=\"width:38px; height:38px; border-radius:11px; background:rgba(225,29,72,0.1); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;\">❤️<\u002Fspan><span><span style=\"font-size:13px; font-weight:700; color:#1c1917; display:block;\">Heart &amp; Airway<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#78716c;\">CPR · choking<\u002Fspan><\u002Fspan><\u002Fsummary><ol style=\"margin:0 0 12px; padding-left:18px; font-size:13px; font-weight:500; line-height:1.45;\"><li>No breathing/pulse: hard compressions 100–120/min, 2 inches deep<\u002Fli><li>Choking, cannot cough: 5 back blows, then 5 abdominal thrusts<\u002Fli><li>Alternate until clear or unresponsive — then CPR<\u002Fli><\u002Fol><\u002Fdetails>\n                  <details style=\"background:rgba(255,255,255,0.92); border:1px solid rgba(28,25,23,0.07); border-radius:14px; padding:0 12px;\"><summary style=\"cursor:pointer; list-style:none; display:flex; gap:8px; align-items:flex-start; padding:12px 0;\"><span style=\"width:38px; height:38px; border-radius:11px; background:rgba(225,29,72,0.1); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;\">⚡<\u002Fspan><span><span style=\"font-size:13px; font-weight:700; color:#1c1917; display:block;\">Shock<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#78716c;\">Pale · cold · clammy<\u002Fspan><\u002Fspan><\u002Fsummary><ol style=\"margin:0 0 12px; padding-left:18px; font-size:13px; font-weight:500; line-height:1.45;\"><li>Call {{ cardEmergencyNum }}. Lay flat — do not let them walk<\u002Fli><li>Elevate legs 12 inches unless head/neck/spine injury<\u002Fli><li>Keep warm. No food, water, or medication<\u002Fli><\u002Fol><\u002Fdetails>\n                  <details style=\"background:rgba(255,255,255,0.92); border:1px solid rgba(28,25,23,0.07); border-radius:14px; padding:0 12px;\"><summary style=\"cursor:pointer; list-style:none; display:flex; gap:8px; align-items:flex-start; padding:12px 0;\"><span style=\"width:38px; height:38px; border-radius:11px; background:rgba(225,29,72,0.1); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;\">🥶<\u002Fspan><span><span style=\"font-size:13px; font-weight:700; color:#1c1917; display:block;\">Hypothermia<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#78716c;\">Warm core · no rubbing<\u002Fspan><\u002Fspan><\u002Fsummary><ol style=\"margin:0 0 12px; padding-left:18px; font-size:13px; font-weight:500; line-height:1.45;\"><li>Move to shelter. Remove wet clothes gently<\u002Fli><li>Warm chest/neck/armpits/groin — not the limbs<\u002Fli><li>No rubbing or massage. Warm drinks only if fully conscious<\u002Fli><\u002Fol><\u002Fdetails>\n                  <details style=\"background:rgba(255,255,255,0.92); border:1px solid rgba(28,25,23,0.07); border-radius:14px; padding:0 12px;\"><summary style=\"cursor:pointer; list-style:none; display:flex; gap:8px; align-items:flex-start; padding:12px 0;\"><span style=\"width:38px; height:38px; border-radius:11px; background:rgba(225,29,72,0.1); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;\">🥵<\u002Fspan><span><span style=\"font-size:13px; font-weight:700; color:#1c1917; display:block;\">Heat<\u002Fspan><span style=\"font-size:11px; font-weight:600; color:#78716c;\">Cool fast · call {{ cardEmergencyNum }}<\u002Fspan><\u002Fspan><\u002Fsummary><ol style=\"margin:0 0 12px; padding-left:18px; font-size:13px; font-weight:500; line-height:1.45;\"><li>Heat stroke: call {{ cardEmergencyNum }} — cool neck/armpits/groin fast<\u002Fli><li>Move to shade. Remove extra clothing. Fan while cooling<\u002Fli><li>Sip cool water only if fully conscious<\u002Fli><\u002Fol><\u002Fdetails>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <!-- Tap-card tab bar: RedMed · Help · Aid (no NFC) -->\n          <div style=\"position:absolute; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #e5e5e5; z-index:16;\">\n            <div style=\"display:flex; padding:4px 0 0;\">\n              <button onClick=\"{{ cardTabMedical }}\" class=\"tab-btn\">\n                <div style=\"{{ cardMedicalPill }}\">\n                  <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"{{ cardMedicalColor }}\"><path d=\"M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <span style=\"{{ cardMedicalLabel }}\">RedMed<\u002Fspan>\n              <\u002Fbutton>\n              <button onClick=\"{{ cardTabHelp }}\" class=\"tab-btn\">\n                <div style=\"{{ cardHelpPill }}\">\n                  <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"{{ cardHelpColor }}\"><path d=\"M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.27-.27.67-.36 1.02-.24C17.52 15.37 18.73 15.57 20 15.57c.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.27.2 2.48.57 3.62.11.35.03.74-.24 1.01L6.6 10.8z\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <span style=\"{{ cardHelpLabel }}\">Help<\u002Fspan>\n              <\u002Fbutton>\n              <button onClick=\"{{ cardTabAid }}\" class=\"tab-btn\">\n                <div style=\"{{ cardAidPill }}\">\n                  <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"{{ cardAidColor }}\"><path d=\"M20 6H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2zm-9 1.5V6a1 1 0 011-1h2a1 1 0 011 1v1.5h-4zM14 15h-2v-2h-2v-2h2v-2h2v2h2v2h-2v2z\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <span style=\"{{ cardAidLabel }}\">Aid<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex; justify-content:center; padding:4px 0 8px;\">\n              <div style=\"width:134px; height:5px; background:rgba(28,25,23,0.18); border-radius:3px;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- EDIT SHEET OVERLAY -->\n      <sc-if value=\"{{ showEdit }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute; top:0; bottom:0; left:0; right:0; background:#f2f2f7; z-index:12; display:flex; flex-direction:column;\">\n          <div style=\"flex-shrink:0; height:59px; position:relative; background:transparent;\">\n            <span style=\"position:absolute; top:18px; left:34px; font-size:15px; font-weight:600; color:#1c1917; letter-spacing:-0.4px; z-index:1;\">9:41<\u002Fspan>\n            <div style=\"position:absolute; top:20px; right:20px; display:flex; align-items:center; gap:5px; z-index:1;\">\n              <svg width=\"17\" height=\"11\" viewBox=\"0 0 17 11\"><rect x=\"0\" y=\"3.5\" width=\"2.5\" height=\"7.5\" rx=\"0.7\" fill=\"#1c1917\"><\u002Frect><rect x=\"4\" y=\"2\" width=\"2.5\" height=\"9\" rx=\"0.7\" fill=\"#1c1917\"><\u002Frect><rect x=\"8\" y=\"0.5\" width=\"2.5\" height=\"10.5\" rx=\"0.7\" fill=\"#1c1917\"><\u002Frect><rect x=\"12\" y=\"0\" width=\"2.5\" height=\"11\" rx=\"0.7\" fill=\"#1c1917\"><\u002Frect><\u002Fsvg>\n              <svg width=\"15\" height=\"12\" viewBox=\"0 0 15 12\" fill=\"none\"><path d=\"M7.5 9.5h.01\" stroke=\"#1c1917\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M4.8 7.2c.7-.7 1.7-1.2 2.7-1.2s2 .5 2.7 1.2\" stroke=\"#1c1917\" stroke-width=\"1.3\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M2 4.5C3.6 2.9 5.4 2 7.5 2s3.9.9 5.5 2.5\" stroke=\"#1c1917\" stroke-width=\"1.3\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <div style=\"position:relative; width:25px; height:12px; border:1.5px solid rgba(28,25,23,0.4); border-radius:2.5px;\">\n                <div style=\"position:absolute; right:-3.5px; top:50%; transform:translateY(-50%); width:2.5px; height:5px; background:rgba(28,25,23,0.4); border-radius:0 1.5px 1.5px 0;\"><\u002Fdiv>\n                <div style=\"position:absolute; inset:1px 3px 1px 1px; background:#1c1917; border-radiu           <path d=\"M11 10a3.5 3.5 0 010 4.6\" fill=\"none\" stroke=\"white\" stroke-width=\"1.3\" stroke-linecap=\"round\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <span style=\"{{ nfcLabelStyle }}\">NFC<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; justify-content:center; padding:4px 0 8px;\">\n          <div style=\"width:134px; height:5px; background:rgba(28,25,23,0.18); border-radius:3px;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n    <!-- RIGHT — Annotations panel (hidden) -->\n    <!--\n    <sc-if value=\"{{ showAnnotations }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:240px; flex-shrink:0; background:#141414; border-left:1px solid rgba(255,255,255,0.05); overflow-y:auto; padding:16px 14px 32px;\">\n        <div style=\"font-size:10px; font-weight:600; color:rgba(255,255,255,0.3); letter-spacing:1px; text-transform:uppercase; padding:0 4px 12px;\">Annotations<\u002Fdiv>\n        <sc-if value=\"{{ isMyID }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <div style=\"background:#1e1e1e; border-radius:10px; padding:12px; border-left:3px solid #e11d48;\">\n              <div style=\"font-size:11px; font-weight:700; color:#e11d48; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">Header<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(255,255,255,0.7); line-height:1.5;\">Logo + device name. Edit button top-right triggers Face ID before saving.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#1e1e1e; border-radius:10px; padding:12px; border-left:3px solid #78716c;\">\n              <div style=\"font-size:11px; font-weight:700; color:rgba(255,255,255,0.5); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">Profile rows<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(255,255,255,0.7); line-height:1.5;\">Name, DOB, blood type. Data written to NFC chip on save.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#1e1e1e; border-radius:10px; padding:12px; border-left:3px solid #78716c;\">\n              <div style=\"font-size:11px; font-weight:700; color:rgba(255,255,255,0.5); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">Allergies / Meds<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(255,255,255,0.7); line-height:1.5;\">Free-text fields. Max 24% of 1KB NFC chip per category.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#1e1e1e; border-radius:10px; padding:12px; border-left:3px solid #78716c;\">\n              <div style=\"font-size:11px; font-weight:700; color:rgba(255,255,255,0.5); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">Contacts<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(255,255,255,0.7); line-height:1.5;\">Emergency contacts — tappable tel: links on the scanned web card.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ is911 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <div style=\"background:#1e1e1e; border-radius:10px; padding:12px; border-left:3px solid #e11d48;\">\n              <div style=\"font-size:11px; font-weight:700; color:#e11d48; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">Call 911 CTA<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(255,255,255,0.7); line-height:1.5;\">Primary action. Opens Phone.app via tel:911. Always first.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#1e1e1e; border-radius:10px; padding:12px; border-left:3px solid #78716c;\">\n              <div style=\"font-size:11px; font-weight:700; color:rgba(255,255,255,0.5); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">Live GPS<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(255,255,255,0.7); line-height:1.5;\">CoreLocation decimal + DMS. Accuracy badge. Copy to clipboard.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#1e1e1e; border-radius:10px; padding:12px; border-left:3px solid #78716c;\">\n              <div style=\"font-size:11px; font-weight:700; color:rgba(255,255,255,0.5); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">No Cell Signal<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(255,255,255,0.7); line-height:1.5;\">Collapse/expand with satellite SOS instructions for iPhone 14+.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isAid }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <div style=\"background:#1e1e1e; border-radius:10px; padding:12px; border-left:3px solid #e11d48;\">\n              <div style=\"font-size:11px; font-weight:700; color:#e11d48; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">2-col grid<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(255,255,255,0.7); line-height:1.5;\">5 pane cards. Tap to expand — expanded pane spans full width.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#1e1e1e; border-radius:10px; padding:12px; border-left:3px solid #78716c;\">\n              <div style=\"font-size:11px; font-weight:700; color:rgba(255,255,255,0.5); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">Topic drill-down<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(255,255,255,0.7); line-height:1.5;\">Tap a row → iOS push nav to Recognize + What to do lists.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#1e1e1e; border-radius:10px; padding:12px; border-left:3px solid #78716c;\">\n              <div style=\"font-size:11px; font-weight:700; color:rgba(255,255,255,0.5); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">Prayer footer<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(255,255,255,0.7); line-height:1.5;\">Italic 10px. Intentional — brand voice.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isNFC }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <div style=\"background:#1e1e1e; border-radius:10px; padding:12px; border-left:3px solid #e11d48;\">\n              <div style=\"font-size:11px; font-weight:700; color:#e11d48; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">Write to band<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(255,255,255,0.7); line-height:1.5;\">CoreNFC NDEFWriterSession. Shows \"Hold to band\" overlay. Face ID gates write.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#1e1e1e; border-radius:10px; padding:12px; border-left:3px solid #78716c;\">\n              <div style=\"font-size:11px; font-weight:700; color:rgba(255,255,255,0.5); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">Tag capacity<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(255,255,255,0.7); line-height:1.5;\">1KB NTAG213. Profile data is JSON-encoded, URL-prefixed (#d=…).<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#1e1e1e; border-radius:10px; padding:12px; border-left:3px solid #78716c;\">\n              <div style=\"font-size:11px; font-weight:700; color:rgba(255,255,255,0.5); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;\">Verify flow<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(255,255,255,0.7); line-height:1.5;\">Scan band → shows same web card a stranger sees. No app needed for readers.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  -->\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 440, &quot;height&quot;: 900 },\n  &quot;accentColor&quot;: {\n    &quot;editor&quot;: &quot;color&quot;,\n    &quot;default&quot;: &quot;#e11d48&quot;,\n    &quot;options&quot;: [&quot;#e11d48&quot;, &quot;#0ea5e9&quot;, &quot;#7c3aed&quot;, &quot;#16a34a&quot;],\n    &quot;section&quot;: &quot;Brand&quot;\n  },\n  &quot;darkMode&quot;: {\n    &quot;editor&quot;: &quot;boolean&quot;,\n    &quot;default&quot;: false,\n    &quot;section&quot;: &quot;Brand&quot;\n  }\n}\">\nclass Component extends DCLogic {\n  findHospitals() {\n    this.setState({ hospitalsStatus: 'loading' });\n    if (!navigator.geolocation) {\n      this.setState({ hospitalsStatus: 'error', hospitalsErrorMsg: 'Location isn\\'t available on this device.' });\n      return;\n    }\n    navigator.geolocation.getCurrentPosition(\n      (pos) => this.queryHospitals(pos.coords.latitude, pos.coords.longitude),\n      () => this.setState({ hospitalsStatus: 'error', hospitalsErrorMsg: 'Location access denied. Enable it in Settings to find nearby hospitals.' }),\n      { enableHighAccuracy: true, timeout: 10000 }\n    );\n  }\n  async queryHospitals(lat, lon) {\n    const R = 3958.8;\n    const toRad = (d) => d * Math.PI / 180;\n    const dist = (lat2, lon2) => {\n      const dLat = toRad(lat2 - lat), dLon = toRad(lon2 - lon);\n      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;\n      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));\n    };\n    const query = `[out:json][timeout:15];(node[\"amenity\"=\"hospital\"](around:24000,${lat},${lon});way[\"amenity\"=\"hospital\"](around:24000,${lat},${lon}););out center 20;`;\n    try {\
