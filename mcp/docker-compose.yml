# RedMed MCP behind Traefik (host network, same as /docker/traefik).
# Deploy to /opt/redmed-mcp on the VPS.

services:
  redmed-mcp:
    build: .
    container_name: redmed-mcp
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      REDMED_EXEC_MODE: local
      REDMED_MCP_HOST: 0.0.0.0
      REDMED_MCP_PORT: "8787"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      # Working now (Hostinger PTR hostname)
      - traefik.http.routers.redmed-mcp-hstgr.rule=Host(`srv2010795.hstgr.cloud`)
      - traefik.http.routers.redmed-mcp-hstgr.entrypoints=websecure
      - traefik.http.routers.redmed-mcp-hstgr.tls=true
      - traefik.http.routers.redmed-mcp-hstgr.tls.certresolver=letsencrypt
      - traefik.http.routers.redmed-mcp-hstgr.service=redmed-mcp
      # Target public hostname (needs Cloudflare grey-cloud A → 2.25.249.204)
      - traefik.http.routers.redmed-mcp.rule=Host(`mcp.redmed.live`)
      - traefik.http.routers.redmed-mcp.entrypoints=websecure
      - traefik.http.routers.redmed-mcp.tls=true
      - traefik.http.routers.redmed-mcp.tls.certresolver=letsencrypt
      - traefik.http.routers.redmed-mcp.service=redmed-mcp
      - traefik.http.services.redmed-mcp.loadbalancer.server.port=8787
