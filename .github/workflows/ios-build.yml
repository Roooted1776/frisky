name: iOS build

# Compiles RedMed on macos-latest so Swift errors surface without a local Mac.
# Path-filtered: doc/HTML-only changes skip the macOS runner (10x bill rate on
# private repos; public repo minutes are still finite).
#
# Billing previously forced workflow_dispatch-only. Ubuntu Pages and manual
# macOS builds are green again — restore automatic push/PR compile.
on:
  push:
    branches: [main]
    paths:
      - 'RedMed-Xcode/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'RedMed-Xcode/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build RedMed
        run: |
          xcodebuild build \
            -project RedMed-Xcode/RedMed.xcodeproj \
            -scheme RedMed \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
