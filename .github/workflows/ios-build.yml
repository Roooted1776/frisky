name: iOS build

# AUTOMATIC CI OFF — GitHub Actions billing/spending limit fails every runner
# (ubuntu and macos) before jobs start, which paints commits red.
#
# After you fix Billing & plans:
# 1. Restore the push/pull_request triggers below (see git history).
# 2. Re-run or delete the failed runs in the Actions tab.
#
# Manual compile when billing works: Actions → Run workflow.
on:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build RedMed
        run: |
          xcodebuild build \
            -project RedMed-Xcode/RedMed.xcodeproj \
            -scheme RedMed \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
