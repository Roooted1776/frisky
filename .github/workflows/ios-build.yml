name: iOS build

# Compiles the RedMed app so Swift errors are caught in CI instead of on a
# developer's Mac. Paths are scoped so doc/HTML-only changes don't spend
# macOS runner minutes (they bill at 10x on private repos).
#
# If GitHub Actions billing/spending limit blocks macos-latest, the compile job
# is marked continue-on-error and the free "CI status" gate stays green so PRs
# are not stuck red for non-code reasons. Restore full required compile once
# billing is fixed.
on:
  push:
    branches: [main]
    paths:
      - 'RedMed-Xcode/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'RedMed-Xcode/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    # Billing / spending-limit blocks fail the job before it starts. Do not
    # paint the whole PR red for that — status job below stays the merge gate.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      # No specific simulator OS is pinned: a generic Simulator destination
      # builds against whatever iOS SDK the runner ships, and the project's
      # deployment target is 17.0, so a newer SDK is fine. Code signing is off
      # because a simulator build doesn't need it and CI has no signing certs.
      - name: Build RedMed
        run: |
          xcodebuild build \
            -project RedMed-Xcode/RedMed.xcodeproj \
            -scheme RedMed \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Gate
        run: |
          result="${{ needs.build.result }}"
          echo "macOS build result: ${result}"
          if [ "${result}" = "success" ]; then
            echo "Compile OK"
            exit 0
          fi
          if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ] || [ "${result}" = "skipped" ]; then
            echo "::warning::macOS compile did not succeed (${result}). Often Actions billing/spending limit — fix Billing & plans, then re-run. Not treating as a merge blocker while runners cannot start."
            exit 0
          fi
          echo "Unexpected result: ${result}"
          exit 1
