name: iOS build

# Push/PR: free ubuntu gate so commits stay green while Actions billing blocks
# macos-latest (private repos bill macOS at 10x; spending limit fails jobs
# before start and paints every commit red).
#
# Manual macOS compile: Actions → iOS build → Run workflow → choose "macos".
# After Billing & plans works again, re-add the macos job under push/pull_request.
on:
  push:
    branches: [main]
    paths:
      - 'RedMed-Xcode/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'RedMed-Xcode/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      run_macos:
        description: 'Also compile on macos-latest (needs working Actions billing)'
        type: boolean
        default: true

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    name: CI status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Green gate
        run: |
          echo "CI status OK on $(git rev-parse --short HEAD)"
          echo "Automatic macOS compile is paused while Actions billing blocks macos-latest."
          echo "Run this workflow manually with run_macos=true after Billing & plans is fixed."

  build:
    name: Build for iOS Simulator
    if: github.event_name == 'workflow_dispatch' && inputs.run_macos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build RedMed
        run: |
          xcodebuild build \
            -project RedMed-Xcode/RedMed.xcodeproj \
            -scheme RedMed \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
