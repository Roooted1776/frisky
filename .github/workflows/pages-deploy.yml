# Deploy the tapper shell to Cloudflare Pages so bracelet taps hit
# https://redmed.pages.dev/get/ (RedMed · 911 · Aid — no login, no server).
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Optional secret CLOUDFLARE_PAGES_PROJECT (defaults to redmed).

name: Pages tapper deploy

on:
  push:
    branches: [main]
    paths:
      - 'get/**'
      - 'get.html'
      - 'index.html'
      - 'card.html'
      - 'sw.js'
      - '_headers'
      - 'assets/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Refuse band-setup / missing tabs
        run: |
          set -euo pipefail
          f=get/index.html
          grep -q 'data-tab="medical"' "$f"
          grep -q 'data-tab="911"' "$f"
          grep -q 'data-tab="aid"' "$f"
          ! grep -q 'Checking your phone' "$f"
          ! grep -q 'Set up your RedMed band' "$f"
          cmp -s get.html get/index.html

      - name: Require Cloudflare secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets, then re-run. Live /get/ is still the old band-setup page until this deploys."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=redmed --commit-dirty=true
