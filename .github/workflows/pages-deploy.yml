# Deploy the tapper shell to Cloudflare Pages so bracelet taps hit
# https://redmed.pages.dev/tapper/ (RedMed · 911 · Aid — no login, no server).
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Optional secret CLOUDFLARE_PAGES_PROJECT (defaults to redmed).
# Missing secrets → skip deploy (green) with a warning; shell checks still run.

name: Pages tapper deploy

on:
  push:
    branches: [main]
    paths:
      - 'tapper/**'
      - 'tapper.html'
      - 'index.html'
      - 'card.html'
      - 'get.html'
      - 'get/**'
      - 'sw.js'
      - '_headers'
      - 'assets/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Refuse band-setup / missing tabs
        run: |
          set -euo pipefail
          f=tapper/index.html
          grep -q 'data-tab="medical"' "$f"
          grep -q 'data-tab="911"' "$f"
          grep -q 'data-tab="aid"' "$f"
          ! grep -q 'Checking your phone' "$f"
          ! grep -q 'Set up your RedMed band' "$f"
          cmp -s tapper.html tapper/index.html
          cmp -s tapper.html RedMed-Xcode/RedMed/tapper.html

      - name: Check Cloudflare secrets
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping live Pages deploy. Add repo secrets, then re-run. Live /tapper/ stays stale until then."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=redmed --commit-dirty=true
